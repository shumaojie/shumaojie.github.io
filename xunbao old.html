<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>寻宝大冒险</title>
  <style>
    :root {
      --ink: #111827;
      --frame: #2b4d68;
      --blue: #5a99db;
      --blue-active: #5c93d6;
      --blue-line: #79a8e6;
      --red: #e60012;
      --pink: #d55469;
      --panel-line: #bdd5dc;
      --success: #0a8c51;
      --warning: #c85a10;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 12px;
      color: var(--ink);
      background: #eef3f9;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
    }

    button,
    input,
    textarea { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    textarea {
      resize: none;
    }

    .game-frame {
      position: relative;
      width: min(100%, 1240px);
      min-height: 720px;
      padding: 12px 16px 18px;
      border: 6px solid var(--frame);
      background: #ffffff;
      overflow: hidden;
    }

    h1 {
      margin: 0;
      color: var(--red);
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-size: clamp(50px, 8vw, 92px);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      letter-spacing: 0;
    }

    .mission {
      margin: 8px 0 4px;
      color: #111111;
      font-size: clamp(20px, 2.8vw, 34px);
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 230px;
      gap: 24px;
      align-items: start;
      margin-top: 10px;
    }

    .map-column {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .north-mark {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding-top: 110px;
      color: #111111;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .north-arrow {
      position: relative;
      width: 18px;
      height: 88px;
    }

    .north-arrow::before {
      position: absolute;
      left: 50%;
      top: 12px;
      width: 3px;
      height: 68px;
      background: #111111;
      content: "";
      transform: translateX(-50%);
    }

    .north-arrow::after {
      position: absolute;
      left: 50%;
      top: 0;
      width: 0;
      height: 0;
      border-right: 8px solid transparent;
      border-bottom: 14px solid #111111;
      border-left: 8px solid transparent;
      content: "";
      transform: translateX(-50%);
    }

    .map-stack {
      position: relative;
      display: grid;
      gap: 0;
      padding-top: 8px;
      padding-bottom: 40px;
    }

    .jumping-tip {
      position: absolute;
      top: 6px;
      right: 4px;
      z-index: 10;
      display: block;
      max-width: min(250px, 48%);
      color: #61c3df;
      font-size: clamp(18px, 2.1vw, 28px);
      font-weight: 900;
      line-height: 1.45;
      text-align: left;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.76);
      animation: floatTip 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    .map-wrap {
      position: relative;
      width: min(100%, 700px);
      overflow: hidden;
      background: #ffffff;
    }

    .map-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .grid-frame {
      fill: #ffffff;
      stroke: #1788ca;
      stroke-width: 4;
    }

    .grid-line {
      stroke: #1f87d0;
      stroke-width: 3.6;
    }

    .map-node {
      fill: #ff1f12;
    }

    .map-label {
      fill: rgba(0, 0, 0, 0.78);
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 1px;
      paint-order: stroke fill;
      stroke: rgba(255, 255, 255, 0.88);
      stroke-width: 8px;
    }

    .map-label--small {
      font-size: 46px;
    }

    .direction-overlay {
      opacity: 0;
      transform: translateY(8px);
      transform-origin: center center;
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .map-wrap.is-direction-active .direction-overlay {
      opacity: 1;
      transform: none;
    }

    .overlay-cross {
      stroke: rgba(31, 117, 185, 0.28);
      stroke-width: 2.4;
      stroke-dasharray: 10 12;
    }

    .overlay-axis {
      stroke: #ffb020;
      stroke-width: 5;
      stroke-dasharray: 10 10;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255, 176, 32, 0.24));
    }

    .overlay-main-line {
      stroke: #ff6e24;
      stroke-width: 7;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(255, 110, 36, 0.24));
    }

    .overlay-arc {
      fill: none;
      stroke: #ff9223;
      stroke-width: 5.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255, 146, 35, 0.22));
    }

    .overlay-anchor {
      fill: #ff6e24;
    }

    .overlay-chip rect {
      fill: rgba(255, 255, 255, 0.94);
      stroke: rgba(255, 110, 36, 0.2);
      stroke-width: 1.5;
    }

    .overlay-text,
    .overlay-axis-label {
      fill: #1d4367;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-weight: 800;
      paint-order: stroke fill;
      stroke: rgba(255, 255, 255, 0.96);
      stroke-width: 6px;
    }

    .overlay-text { font-size: 21px; }

    .overlay-axis-label { font-size: 19px; }

    .treasure-pin {
      position: absolute;
      left: 65.8%;
      top: 59.6%;
      width: clamp(64px, 9vw, 100px);
      transform: translate(-50%, -66%) scale(0.84);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      filter: drop-shadow(0 10px 12px rgba(64, 42, 0, 0.25));
    }

    .is-found .treasure-pin {
      opacity: 1;
      transform: translate(-50%, -66%) scale(1);
    }

    .scale {
      position: absolute;
      left: 60%;
      bottom: 4px;
      z-index: 8;
      transform: translateX(-50%);
      color: #000000;
      font-family: "KaiTi", "STKaiti", "SimSun", serif;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .control-column {
      display: grid;
      gap: 16px;
      align-content: start;
      padding-top: 148px;
    }

    .mode-buttons {
      display: grid;
      gap: 22px;
      justify-items: center;
    }

    .mode-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 188px;
      min-height: 74px;
      padding: 0 18px;
      border: 5px solid var(--blue-line);
      border-radius: 16px;
      background: #d8e9ff;
      color: #ff1515;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 8px 0 rgba(79, 132, 194, 0.16), inset 0 0 0 4px rgba(255, 255, 255, 0.36);
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .mode-button:hover { transform: translateY(-2px); }

    .mode-button.is-active {
      background: var(--blue-active);
      box-shadow: 0 8px 0 rgba(57, 98, 152, 0.18), inset 0 0 0 4px rgba(255, 255, 255, 0.2);
    }

    .mode-button.is-done {
      border-color: #59b482;
      box-shadow: 0 0 0 4px rgba(89, 180, 130, 0.16);
    }

    .radio-dot {
      width: 30px;
      height: 30px;
      margin-right: 14px;
      border: 6px solid #356aa1;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 0 0 8px #ffffff;
    }

    .mode-button.is-active .radio-dot,
    .mode-button.is-done .radio-dot {
      background: #2f6bac;
      box-shadow: inset 0 0 0 6px #ffffff;
    }

    .answer-panel {
      padding: 18px 18px 16px;
      border: 3px solid rgba(189, 213, 220, 0.9);
      border-radius: 18px;
      background: rgba(239, 252, 255, 0.96);
      color: var(--pink);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.5;
      box-shadow: 0 12px 24px rgba(71, 111, 145, 0.08);
    }

    form { margin: 0; }

    .sentence {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      white-space: normal;
    }

    .prompt-prefix {
      color: #bf3350;
      font-size: 22px;
      font-weight: 800;
    }

    .sentence input {
      width: 64px;
      min-width: 64px;
      min-height: 42px;
      border: 0;
      border-bottom: 3px solid rgba(213, 84, 105, 0.62);
      outline: 0;
      background: transparent;
      color: #b91527;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
    }

    .direction-sentence {
      display: grid;
      grid-template-columns: auto 30px minmax(0, 1fr) 30px;
      gap: 6px;
      align-items: start;
    }

    .big-paren {
      color: #bf3350;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
    }

    .direction-input-wrap {
      min-height: 76px;
      padding: 6px 10px 8px;
      border-bottom: 3px solid rgba(213, 84, 105, 0.62);
      background: rgba(255, 255, 255, 0.72);
    }

    .direction-input {
      display: block;
      width: 100%;
      min-height: 56px;
      max-height: 120px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #b91527;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.45;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .sentence input:focus,
    .direction-input:focus {
      border-bottom-color: #b91527;
      background: rgba(255, 255, 255, 0.78);
    }

    .submit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .submit-button,
    .clear-button,
    .open-button {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
    }

    .submit-button {
      background: #2e83c6;
      color: #ffffff;
    }

    .clear-button,
    .open-button {
      border: 2px solid #aac6d8;
      background: #ffffff;
      color: #36566b;
    }

    .open-button {
      border-color: #f0c35a;
      background: #fff4c6;
      color: #9a5a00;
    }

    .feedback {
      min-height: 48px;
      margin-top: 12px;
      color: var(--warning);
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 900;
      line-height: 1.42;
      white-space: pre-line;
      animation: pop 180ms ease;
    }

    .feedback.is-success { color: var(--success); }

    .status-row {
      display: grid;
      gap: 12px;
    }

    .status-card {
      min-height: 92px;
      padding: 18px 20px;
      border-radius: 24px;
      background: #ffffff;
      color: #52677a;
      font-size: clamp(18px, 2.2vw, 26px);
      font-weight: 900;
      line-height: 1.35;
      box-shadow: inset 0 0 0 1px rgba(116, 150, 179, 0.16);
    }

    .status-card.is-done {
      color: var(--success);
      background: #edfff6;
      box-shadow: inset 0 0 0 2px rgba(89, 180, 130, 0.14);
    }

    .treasure-result {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 10px;
      color: var(--success);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.3;
      overflow: hidden;
    }

    .treasure-button {
      width: 132px;
      max-width: 100%;
      padding: 0;
      background: transparent;
      filter: drop-shadow(0 8px 10px rgba(64, 42, 0, 0.22));
    }

    .treasure-svg {
      display: block;
      width: 100%;
      height: auto;
      animation: chestPulse 1.4s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .blessing {
      max-width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fff7c9 0%, #fff 100%);
      color: #b91c1c;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 800;
      line-height: 1.32;
      text-align: center;
      box-shadow: 0 12px 22px rgba(205, 106, 0, 0.14);
    }

    .confetti-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: -16px;
      width: 9px;
      height: 16px;
      border-radius: 2px;
      animation: confetti 1.7s ease-out forwards;
    }

    @keyframes floatTip {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pop {
      from { transform: scale(0.96); opacity: 0.2; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes chestPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.05); }
    }

    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(300px) rotate(540deg); opacity: 0; }
    }

    @media (max-width: 760px) {
      .game-frame { min-height: 0; padding: 10px; border-width: 4px; }
      .mission { font-size: 18px; }
      .game-layout { grid-template-columns: minmax(0, 1fr) 160px; gap: 12px; }
      .map-column { grid-template-columns: 28px minmax(0, 1fr); gap: 6px; }
      .north-mark { font-size: 16px; padding-top: 76px; }
      .north-arrow { height: 56px; }
      .north-arrow::before { height: 42px; top: 10px; }
      .jumping-tip {
        top: 2px;
        right: 0;
        max-width: min(180px, 52%);
        font-size: 14px;
      }
      .scale {
        left: 56%;
        bottom: 0;
        font-size: 14px;
      }
      .control-column { padding-top: 82px; gap: 10px; }
      .mode-buttons { justify-items: stretch; gap: 12px; }
      .mode-button {
        width: 100%;
        min-width: 0;
        min-height: 46px;
        padding: 0 10px;
        border-width: 3px;
        font-size: 22px;
      }
      .radio-dot {
        width: 18px;
        height: 18px;
        margin-right: 8px;
        border-width: 4px;
        box-shadow: inset 0 0 0 4px #ffffff;
      }
      .answer-panel { padding: 12px; font-size: 16px; }
      .prompt-prefix { font-size: 16px; }
      .sentence input {
        width: 50px;
        min-width: 50px;
        min-height: 34px;
        font-size: 18px;
      }
      .big-paren { font-size: 36px; }
      .direction-input-wrap {
        min-height: 56px;
        padding: 4px 8px 6px;
      }
      .direction-input {
        min-height: 40px;
        font-size: 18px;
      }
      .submit-button,
      .clear-button,
      .open-button {
        min-height: 34px;
        padding: 0 12px;
        font-size: 13px;
      }
      .feedback {
        min-height: 30px;
        font-size: 14px;
      }
      .status-card {
        min-height: 0;
        padding: 12px;
        border-radius: 16px;
        font-size: 14px;
      }
      .treasure-result { font-size: 14px; }
    }

    @media (max-width: 430px) {
      body { padding: 6px; }
      .game-layout { grid-template-columns: 1fr; gap: 14px; }
      .control-column { padding-top: 0; }
      .mode-buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .jumping-tip {
        position: static;
        max-width: none;
        margin: 0 0 8px 28px;
      }
      .scale {
        position: static;
        transform: none;
        margin: 6px 0 0 76px;
      }
      .direction-sentence { grid-template-columns: 1fr; }
      .big-paren { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-frame">
    <h1>寻宝大冒险</h1>
    <p class="mission">学校在街区里设置了1个“藏宝点”，可能是公园或医院。</p>

    <div class="game-layout">
      <section class="map-column" aria-label="寻宝地图">
        <div class="north-mark" aria-hidden="true">
          <span>北</span>
          <span class="north-arrow"></span>
        </div>
        <div class="map-stack">
          <div class="jumping-tip" aria-live="polite">两种方法都正确，<br>就可以找到宝藏了</div>
          <div id="mapWrap" class="map-wrap">
            <svg id="treasureMap" class="map-svg" viewBox="0 0 700 560" role="img" aria-label="街区寻宝地图，学校、公园、医院分布在方格中">
              <rect width="700" height="560" fill="#ffffff"></rect>
              <g aria-hidden="true">
                <rect class="grid-frame" x="110" y="54" width="420" height="420"></rect>
                <line class="grid-line" x1="180" y1="54" x2="180" y2="474"></line>
                <line class="grid-line" x1="250" y1="54" x2="250" y2="474"></line>
                <line class="grid-line" x1="320" y1="54" x2="320" y2="474"></line>
                <line class="grid-line" x1="390" y1="54" x2="390" y2="474"></line>
                <line class="grid-line" x1="460" y1="54" x2="460" y2="474"></line>
                <line class="grid-line" x1="110" y1="124" x2="530" y2="124"></line>
                <line class="grid-line" x1="110" y1="194" x2="530" y2="194"></line>
                <line class="grid-line" x1="110" y1="264" x2="530" y2="264"></line>
                <line class="grid-line" x1="110" y1="334" x2="530" y2="334"></line>
                <line class="grid-line" x1="110" y1="404" x2="530" y2="404"></line>
              </g>

              <g aria-hidden="true">
                <circle class="map-node" cx="180" cy="404" r="18"></circle>
                <circle class="map-node" cx="460" cy="334" r="9"></circle>
                <circle class="map-node" cx="460" cy="124" r="9"></circle>
              </g>

              <g aria-hidden="true">
                <text class="map-label map-label--small" x="504" y="175" text-anchor="start">公园</text>
                <text class="map-label map-label--small" x="500" y="388" text-anchor="start">医院</text>
                <text class="map-label" x="118" y="470" text-anchor="start">学校</text>
              </g>

              <g class="direction-overlay" aria-hidden="true">
                <line class="overlay-cross" x1="180" y1="78" x2="180" y2="438"></line>
                <line class="overlay-cross" x1="98" y1="404" x2="520" y2="404"></line>
                <line class="overlay-axis" x1="180" y1="404" x2="460" y2="404"></line>
                <line class="overlay-main-line" x1="180" y1="404" x2="460" y2="334"></line>
                <path class="overlay-arc" d="M252 404 A72 72 0 0 0 250 386"></path>
                <circle class="overlay-anchor" cx="180" cy="404" r="6"></circle>
                <circle class="overlay-anchor" cx="460" cy="334" r="6"></circle>
                <g class="overlay-chip">
                  <rect x="294" y="346" width="112" height="34" rx="17"></rect>
                  <text class="overlay-text" x="350" y="368" text-anchor="middle">1000米</text>
                </g>
                <g class="overlay-chip">
                  <rect x="226" y="356" width="78" height="34" rx="17"></rect>
                  <text class="overlay-text" x="265" y="378" text-anchor="middle">13°</text>
                </g>
                <text class="overlay-axis-label" x="470" y="398" text-anchor="start">东</text>
                <text class="overlay-axis-label" x="192" y="92" text-anchor="start">北</text>
              </g>
            </svg>
            <svg class="treasure-pin" viewBox="0 0 180 126" role="img" aria-label="宝箱图片">
              <path d="M25 57h130v58H25z" fill="#c97418" stroke="#603704" stroke-width="7"/>
              <path d="M29 57c6-33 30-49 61-49s55 16 61 49z" fill="#f5b72d" stroke="#603704" stroke-width="7"/>
              <path d="M19 57h142v25H19z" fill="#e9941b" stroke="#603704" stroke-width="7"/>
              <path d="M87 11v104" stroke="#fff1a9" stroke-width="13"/>
              <path d="M23 91h132" stroke="#8b510e" stroke-width="6"/>
              <rect x="70" y="70" width="40" height="38" rx="7" fill="#ffdd54" stroke="#603704" stroke-width="6"/>
              <circle cx="90" cy="90" r="5" fill="#603704"/>
            </svg>
          </div>
          <div class="scale">比例尺1：20000</div>
        </div>
      </section>

      <section class="control-column" aria-label="答题区">
        <div class="mode-buttons" role="group" aria-label="选择寻宝方式">
          <button id="coordinateMode" class="mode-button" type="button"><span class="radio-dot" aria-hidden="true"></span>数对</button>
          <button id="directionMode" class="mode-button" type="button"><span class="radio-dot" aria-hidden="true"></span>方向+距离</button>
        </div>

        <div id="answerPanel" class="answer-panel" hidden>
          <form id="coordinateForm" hidden>
            <div class="sentence">
              <span class="prompt-prefix">我认为“藏宝点”在数对</span>
              <span class="big-paren">（</span>
              <input id="columnInput" type="number" step="any" inputmode="decimal" aria-label="列数">
              <span class="prompt-prefix">，</span>
              <input id="rowInput" type="number" step="any" inputmode="decimal" aria-label="行数">
              <span class="big-paren">）</span>
            </div>
            <div class="submit-row">
              <button class="submit-button" type="submit">确定</button>
              <button class="clear-button" type="button" data-clear="coordinate">重新填写</button>
            </div>
          </form>

          <form id="directionForm" hidden>
            <div class="direction-sentence">
              <span class="prompt-prefix">我认为藏宝点在</span>
              <span class="big-paren">（</span>
              <label class="direction-input-wrap">
                <textarea id="directionAnswer" class="direction-input" rows="2" aria-label="方向和距离描述" placeholder="学校的东偏北13°方向1000米"></textarea>
              </label>
              <span class="big-paren">）</span>
            </div>
            <div class="submit-row">
              <button class="submit-button" type="submit">确定</button>
              <button class="clear-button" type="button" data-clear="direction">重新填写</button>
            </div>
          </form>

          <div id="feedback" class="feedback" aria-live="polite"></div>
        </div>

        <div id="statusRow" class="status-row" hidden>
          <div id="coordinateStatus" class="status-card">数对：等待作答</div>
          <div id="directionStatus" class="status-card">方向+距离：等待作答</div>
        </div>

        <div id="treasureResult" class="treasure-result" hidden>
          <div>你太厉害啦！宝藏就在这里，请你打开它吧！</div>
          <button id="treasureButton" class="treasure-button" type="button" aria-label="打开宝藏">
            <svg class="treasure-svg" viewBox="0 0 180 126" aria-hidden="true">
              <path d="M25 57h130v58H25z" fill="#c97418" stroke="#603704" stroke-width="7"/>
              <path d="M29 57c6-33 30-49 61-49s55 16 61 49z" fill="#f5b72d" stroke="#603704" stroke-width="7"/>
              <path d="M19 57h142v25H19z" fill="#e9941b" stroke="#603704" stroke-width="7"/>
              <path d="M87 11v104" stroke="#fff1a9" stroke-width="13"/>
              <path d="M23 91h132" stroke="#8b510e" stroke-width="6"/>
              <rect x="70" y="70" width="40" height="38" rx="7" fill="#ffdd54" stroke="#603704" stroke-width="6"/>
              <circle cx="90" cy="90" r="5" fill="#603704"/>
            </svg>
          </button>
          <div id="blessing" class="blessing" hidden></div>
          <div id="confettiField" class="confetti-field" aria-hidden="true"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var coordinateAnswer = { column: 5, row: 2 };
      var blessings = [
        "六年时光沉淀专属宝藏，愿你带着收获奔赴下一程山海",
        "少年心怀璀璨宝藏，前路漫漫亦会步步生光",
        "积攒学识与勇气做行囊，你本身就是独一无二的宝藏",
        "毕业解锁成长新篇章，愿你的人生宝藏愈发丰盈闪亮",
        "珍藏童年美好宝藏，带着热爱奔赴更远的远方",
        "心怀热忱皆是宝藏，往后岁岁年年皆得所愿",
        "岁月赠予成长宝藏，勇敢奔赴属于你的广阔天地",
        "自带光芒便是无价宝藏，提笔书写崭新少年篇章",
        "收好六年珍贵回忆宝藏，昂首阔步奔赴崭新旅程",
        "以初心守护心中宝藏，未来一路繁花万丈荣光"
      ];
      var state = {
        activeMode: "",
        coordinateWrongCount: 0,
        directionWrongCount: 0,
        coordinateCorrect: false,
        directionCorrect: false,
        audioContext: null
      };
      var elements = {};

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }

      function init() {
        elements.mapWrap = document.getElementById("mapWrap");
        elements.coordinateMode = document.getElementById("coordinateMode");
        elements.directionMode = document.getElementById("directionMode");
        elements.answerPanel = document.getElementById("answerPanel");
        elements.coordinateForm = document.getElementById("coordinateForm");
        elements.directionForm = document.getElementById("directionForm");
        elements.columnInput = document.getElementById("columnInput");
        elements.rowInput = document.getElementById("rowInput");
        elements.directionAnswer = document.getElementById("directionAnswer");
        elements.feedback = document.getElementById("feedback");
        elements.statusRow = document.getElementById("statusRow");
        elements.coordinateStatus = document.getElementById("coordinateStatus");
        elements.directionStatus = document.getElementById("directionStatus");
        elements.treasureResult = document.getElementById("treasureResult");
        elements.treasureButton = document.getElementById("treasureButton");
        elements.blessing = document.getElementById("blessing");
        elements.confettiField = document.getElementById("confettiField");

        elements.coordinateMode.addEventListener("click", function () { selectMode("coordinate"); });
        elements.directionMode.addEventListener("click", function () { selectMode("direction"); });
        elements.coordinateForm.addEventListener("submit", submitCoordinate);
        elements.directionForm.addEventListener("submit", submitDirection);
        elements.directionAnswer.addEventListener("input", resizeDirectionInput);
        elements.treasureButton.addEventListener("click", openTreasure);
        document.querySelectorAll("[data-clear]").forEach(function (button) {
          button.addEventListener("click", function () { clearForm(button.getAttribute("data-clear")); });
        });

        updateStatusRowVisibility();
        resizeDirectionInput();
        registerServiceWorker();
      }

      function selectMode(mode) {
        state.activeMode = mode;
        startAudio();
        elements.answerPanel.hidden = false;
        elements.mapWrap.classList.toggle("is-direction-active", mode === "direction");
        elements.coordinateForm.hidden = mode !== "coordinate";
        elements.directionForm.hidden = mode !== "direction";
        elements.coordinateMode.classList.toggle("is-active", mode === "coordinate");
        elements.directionMode.classList.toggle("is-active", mode === "direction");
        showFeedback("请填写你的" + (mode === "coordinate" ? "数对" : "方向和距离") + "答案。", false, false);
        if (mode === "coordinate") {
          elements.columnInput.focus();
        } else {
          resizeDirectionInput();
          elements.directionAnswer.focus();
        }
      }

      function submitCoordinate(event) {
        var column;
        var row;
        event.preventDefault();
        startAudio();
        column = Number(elements.columnInput.value);
        row = Number(elements.rowInput.value);

        if (!Number.isFinite(column) || !Number.isFinite(row)) {
          showFeedback("请把数对里的两个数字都填完整。", false, true);
          return;
        }

        if (column === coordinateAnswer.column && row === coordinateAnswer.row) {
          markCorrect("coordinate");
          return;
        }

        state.coordinateWrongCount += 1;
        if (state.coordinateWrongCount % 3 === 0) {
          showFeedback("没关系，寻宝就是需要不断尝试呀", false, true);
          return;
        }

        if (column < row) {
          showFeedback("数对的第一个数表示“列”，第二个数表示“行”哦，再调整一下吧！", false, true);
          return;
        }

        if (Math.abs(column - coordinateAnswer.column) < 2 && Math.abs(row - coordinateAnswer.row) < 2) {
          showFeedback("离宝藏超近了，再调整一下吧！", false, true);
          return;
        }

        showFeedback("宝藏不在这个位置哦", false, true);
      }

      function submitDirection(event) {
        var result;
        var message;
        event.preventDefault();
        startAudio();
        result = checkDirectionAnswer(elements.directionAnswer.value);

        if (result.correct) {
          markCorrect("direction");
          return;
        }

        state.directionWrongCount += 1;
        message = getDirectionHint(result);
        showFeedback(message, false, true);
        speak(message);
      }

      function checkDirectionAnswer(value) {
        var text = normalizeText(value);
        var hasSchool = text.indexOf("学校") !== -1;
        var hasDirection = text.indexOf("东偏北") !== -1;
        var hasDegree = /(12|13|14)(°|度)?/.test(text);
        var hasDistance = /(980|1000|1020)米?/.test(text);
        return {
          correct: hasSchool && hasDirection && hasDegree && hasDistance,
          hasSchool: hasSchool,
          hasDirection: hasDirection,
          hasDegree: hasDegree,
          hasDistance: hasDistance,
          empty: text.length === 0
        };
      }

      function getDirectionHint(result) {
        var missingCount = [result.hasSchool, result.hasDirection, result.hasDegree, result.hasDistance].filter(function (value) { return !value; }).length;
        if (result.empty || missingCount >= 2) {
          return "想一想，少了什么关键信息呢？";
        }
        if (!result.hasSchool) {
          return "想一想，观测点写清楚了吗？";
        }
        if (!result.hasDirection) {
          return "再想一想，藏宝点的方向正确吗？";
        }
        if (!result.hasDegree) {
          return "再想一想，藏宝点的方向对应的角度正确吗？";
        }
        if (!result.hasDistance) {
          return "再想一想，藏宝点的距离正确吗？";
        }
        return "宝藏不在这里哦！";
      }

      function markCorrect(mode) {
        if (mode === "coordinate") {
          state.coordinateCorrect = true;
          elements.coordinateStatus.textContent = "数对：已经答对";
          elements.coordinateStatus.classList.add("is-done");
          elements.coordinateMode.classList.add("is-done");
        } else {
          state.directionCorrect = true;
          elements.directionStatus.textContent = "方向+距离：已经答对";
          elements.directionStatus.classList.add("is-done");
          elements.directionMode.classList.add("is-done");
        }

        updateStatusRowVisibility();

        if (state.coordinateCorrect && state.directionCorrect) {
          showTreasure();
          return;
        }

        showFeedback("恭喜你，已经答对一种方法了，继续尝试第二种方法吧！", true, true);
      }

      function showTreasure() {
        elements.mapWrap.classList.add("is-found");
        elements.treasureResult.hidden = false;
        elements.statusRow.hidden = false;
        showFeedback("宝藏就在这里！", true, true);
        playMelody([523, 659, 784, 1046], 0.12);
      }

      function openTreasure() {
        var index = Math.floor(Math.random() * blessings.length);
        startAudio();
        elements.blessing.textContent = blessings[index];
        elements.blessing.hidden = false;
        createConfetti();
        playMelody([784, 988, 1175, 1319, 1568], 0.1);
      }

      function clearForm(mode) {
        if (mode === "coordinate") {
          elements.columnInput.value = "";
          elements.rowInput.value = "";
          elements.columnInput.focus();
        } else {
          elements.directionAnswer.value = "";
          resizeDirectionInput();
          elements.directionAnswer.focus();
        }
        showFeedback("可以重新修改输入，再试一次。", false, false);
      }

      function showFeedback(message, success, sound) {
        elements.feedback.textContent = message;
        elements.feedback.classList.toggle("is-success", success);
        elements.feedback.style.animation = "none";
        elements.feedback.offsetHeight;
        elements.feedback.style.animation = "pop 180ms ease";
        if (sound) {
          playMelody(success ? [523, 659, 784] : [392, 330], 0.1);
        }
      }

      function updateStatusRowVisibility() {
        elements.statusRow.hidden = !(state.coordinateCorrect || state.directionCorrect);
      }

      function resizeDirectionInput() {
        if (!elements.directionAnswer) {
          return;
        }
        elements.directionAnswer.style.height = "auto";
        elements.directionAnswer.style.height = Math.min(elements.directionAnswer.scrollHeight, 120) + "px";
      }

      function createConfetti() {
        var colors = ["#e60012", "#f5b832", "#2e83c6", "#0a8c51", "#d55469"];
        var i;
        elements.confettiField.innerHTML = "";
        for (i = 0; i < 52; i += 1) {
          var piece = document.createElement("span");
          piece.className = "confetti-piece";
          piece.style.left = Math.random() * 100 + "%";
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = Math.random() * 0.45 + "s";
          piece.style.transform = "rotate(" + Math.random() * 180 + "deg)";
          elements.confettiField.appendChild(piece);
        }
      }

      function normalizeText(value) {
        return String(value || "")
          .replace(/\s+/g, "")
          .replace(/。/g, "")
          .replace(/，/g, "")
          .replace(/,/g, "")
          .replace(/东偏北方向/g, "东偏北")
          .trim();
      }

      function startAudio() {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          return;
        }
        if (!state.audioContext) {
          state.audioContext = new AudioContext();
        }
        if (state.audioContext.state === "suspended") {
          state.audioContext.resume();
        }
      }

      function playMelody(notes, duration) {
        var ctx;
        var now;
        startAudio();
        ctx = state.audioContext;
        if (!ctx) {
          return;
        }
        now = ctx.currentTime;
        notes.forEach(function (frequency, index) {
          var oscillator = ctx.createOscillator();
          var gain = ctx.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, now + index * duration);
          gain.gain.exponentialRampToValueAtTime(0.12, now + index * duration + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (index + 1) * duration);
          oscillator.connect(gain).connect(ctx.destination);
          oscillator.start(now + index * duration);
          oscillator.stop(now + (index + 1) * duration + 0.02);
        });
      }

      function speak(message) {
        if (!("speechSynthesis" in window)) {
          return;
        }
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "zh-CN";
        utterance.rate = 0.92;
        utterance.pitch = 1.08;
        window.speechSynthesis.speak(utterance);
      }

      function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        }
      }
    }());
  </script>
</body>
</html>
