<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>寻宝大冒险</title>
  <style>
    :root {
      --ink: #111827;
      --frame: #344e63;
      --blue: #5a99db;
      --blue-soft: #d9ecfb;
      --blue-line: #78afd9;
      --red: #e60012;
      --pink: #d55469;
      --panel: #effcff;
      --panel-line: #bdd5dc;
      --success: #0a8c51;
      --warning: #c85a10;
      --gold: #f5b832;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 10px;
      color: var(--ink);
      background: radial-gradient(circle at top, #f8fbff 0%, #eef5fb 44%, #e5eef7 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
    }

    button,
    input { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .game-frame {
      position: relative;
      width: min(100%, 1040px);
      min-height: 680px;
      padding: 16px 18px 18px;
      border: 1px solid rgba(52, 78, 99, 0.18);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(247, 251, 255, 0.96) 100%);
      box-shadow: 0 24px 60px rgba(48, 84, 116, 0.16);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      color: var(--red);
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-size: clamp(28px, 4.8vw, 54px);
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .mission {
      margin: 10px auto 8px;
      max-width: 760px;
      color: #41576a;
      font-size: clamp(16px, 2.2vw, 24px);
      font-weight: 700;
      line-height: 1.42;
      text-align: center;
    }

    .jumping-tip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #ffd267;
      border-radius: 999px;
      background: #fff8d8;
      color: #c23522;
      font-size: clamp(13px, 1.8vw, 18px);
      font-weight: 800;
      line-height: 1.1;
      animation: jump 1.05s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      gap: 16px;
      align-items: start;
      margin-top: 12px;
    }

    .map-column {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .north-mark {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding-top: 12px;
      color: #335671;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
    }

    .north-arrow {
      position: relative;
      width: 12px;
      height: 44px;
    }

    .north-arrow::before {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 2px;
      height: 34px;
      background: #325773;
      content: "";
      transform: translateX(-50%);
    }

    .north-arrow::after {
      position: absolute;
      left: 50%;
      top: 0;
      width: 0;
      height: 0;
      border-right: 5px solid transparent;
      border-bottom: 9px solid #325773;
      border-left: 5px solid transparent;
      content: "";
      transform: translateX(-50%);
    }

    .map-stack {
      position: relative;
      display: grid;
      gap: 0;
    }

    .map-wrap {
      position: relative;
      width: min(100%, 720px);
      border-radius: 24px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 18px 40px rgba(40, 82, 116, 0.14);
    }

    .map-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .grid-frame {
      fill: #fbfeff;
      stroke: #1788ca;
      stroke-width: 4;
    }

    .grid-line {
      stroke: #2b92d7;
      stroke-width: 3.2;
      opacity: 0.94;
    }

    .map-node {
      fill: #ff3c2d;
      filter: drop-shadow(0 0 6px rgba(255, 76, 66, 0.22));
    }

    .map-label {
      fill: rgba(17, 24, 39, 0.56);
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: 54px;
      font-weight: 700;
      letter-spacing: 1px;
      paint-order: stroke fill;
      stroke: rgba(255, 255, 255, 0.72);
      stroke-width: 7px;
    }

    .map-label--small {
      font-size: 48px;
    }

    .direction-overlay {
      opacity: 0;
      transform: translateY(6px);
      transform-origin: center center;
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .map-wrap.is-direction-active .direction-overlay {
      opacity: 1;
      transform: none;
    }

    .overlay-cross {
      stroke: rgba(23, 105, 170, 0.28);
      stroke-width: 2;
      stroke-dasharray: 10 12;
    }

    .overlay-axis {
      stroke: rgba(255, 176, 32, 0.98);
      stroke-width: 4.5;
      stroke-dasharray: 10 10;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255, 176, 32, 0.26));
    }

    .overlay-main-line {
      stroke: #ff6a22;
      stroke-width: 6.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(255, 106, 34, 0.24));
    }

    .overlay-arc {
      fill: none;
      stroke: #ff9223;
      stroke-width: 5.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255, 146, 35, 0.22));
    }

    .overlay-anchor {
      fill: #ff6a22;
    }

    .overlay-chip rect {
      fill: rgba(255, 255, 255, 0.92);
      stroke: rgba(255, 106, 34, 0.18);
      stroke-width: 1.5;
    }

    .overlay-text,
    .overlay-axis-label {
      fill: #1d4367;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-weight: 800;
      paint-order: stroke fill;
      stroke: rgba(255, 255, 255, 0.96);
      stroke-width: 6px;
    }

    .overlay-text { font-size: 21px; }

    .overlay-axis-label { font-size: 19px; }

    .treasure-pin {
      position: absolute;
      left: 55.8%;
      top: 84.2%;
      width: clamp(56px, 8vw, 92px);
      transform: translate(-50%, -66%) scale(0.86);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      filter: drop-shadow(0 10px 12px rgba(64, 42, 0, 0.25));
    }

    .is-found .treasure-pin {
      opacity: 1;
      transform: translate(-50%, -66%) scale(1);
    }

    .scale {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 8;
      margin-left: 0;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 10px 20px rgba(34, 73, 106, 0.12);
      color: #385871;
      font-family: "KaiTi", "STKaiti", "SimSun", serif;
      font-size: clamp(12px, 1.5vw, 14px);
      font-weight: 800;
      line-height: 1;
    }

    .control-column {
      display: grid;
      gap: 10px;
      align-content: start;
      padding-top: 4px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mode-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid rgba(120, 175, 217, 0.56);
      border-radius: 999px;
      background: rgba(232, 245, 255, 0.9);
      color: #d41121;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4), 0 10px 24px rgba(82, 132, 171, 0.1);
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .mode-button:hover { transform: translateY(-2px); }

    .mode-button.is-active {
      background: var(--blue);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(28, 93, 159, 0.14), 0 10px 20px rgba(42, 102, 173, 0.18);
    }

    .mode-button.is-done {
      border-color: #5dbb89;
      box-shadow: 0 0 0 3px rgba(93, 187, 137, 0.14);
    }

    .radio-dot {
      width: 11px;
      height: 11px;
      margin-right: 6px;
      border: 2px solid #376a9c;
      border-radius: 50%;
      background: #eef8ff;
      box-shadow: inset 0 0 0 2px #eef8ff;
    }

    .mode-button.is-active .radio-dot,
    .mode-button.is-done .radio-dot { background: #2c6fbd; }

    .answer-panel {
      min-height: 0;
      padding: 12px 14px;
      border: 1px solid rgba(189, 213, 220, 0.72);
      border-radius: 18px;
      background: rgba(239, 252, 255, 0.84);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 28px rgba(60, 102, 139, 0.1);
      color: var(--pink);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.45;
    }

    .empty-note {
      color: #6f8290;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }

    form { margin: 0; }

    .sentence {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      overflow: visible;
      padding-bottom: 0;
      white-space: normal;
    }

    .sentence input {
      width: 54px;
      min-width: 54px;
      min-height: 34px;
      border: 0;
      border-bottom: 2px solid rgba(213, 84, 105, 0.62);
      outline: 0;
      background: transparent;
      color: #b91527;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }

    .sentence input:focus {
      border-bottom-color: #b91527;
      background: rgba(255, 255, 255, 0.72);
    }

    .direction-input {
      width: 100%;
      min-width: 0;
      flex: 1 1 180px;
      padding: 0 6px;
      text-align: left !important;
    }

    .submit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .submit-button,
    .clear-button,
    .open-button {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .submit-button {
      background: #2e83c6;
      color: #ffffff;
    }

    .clear-button,
    .open-button {
      border: 2px solid #aac6d8;
      background: #ffffff;
      color: #36566b;
    }

    .open-button {
      border-color: #f0c35a;
      background: #fff4c6;
      color: #9a5a00;
    }

    .feedback {
      min-height: 40px;
      margin-top: 10px;
      color: var(--warning);
      font-size: clamp(14px, 2vw, 20px);
      font-weight: 800;
      line-height: 1.45;
      white-space: pre-line;
      animation: pop 180ms ease;
    }

    .feedback.is-success { color: var(--success); }

    .status-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .status-card {
      display: grid;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.78);
      color: #546778;
      font-size: 12px;
      font-weight: 800;
    }

    .status-card.is-done { color: var(--success); background: #edfff6; }

    .treasure-result {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--success);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
      overflow: hidden;
    }

    .treasure-button {
      width: 112px;
      max-width: 100%;
      padding: 0;
      background: transparent;
      filter: drop-shadow(0 8px 10px rgba(64, 42, 0, 0.22));
    }

    .treasure-svg {
      display: block;
      width: 100%;
      height: auto;
      animation: chestPulse 1.4s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .blessing {
      max-width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fff7c9 0%, #fff 100%);
      color: #b91c1c;
      font-size: clamp(16px, 2.1vw, 22px);
      font-weight: 800;
      line-height: 1.32;
      text-align: center;
      box-shadow: 0 12px 22px rgba(205, 106, 0, 0.14);
    }

    .confetti-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: -16px;
      width: 9px;
      height: 16px;
      border-radius: 2px;
      animation: confetti 1.7s ease-out forwards;
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-8px) scale(1.02); }
    }

    @keyframes pop {
      from { transform: scale(0.96); opacity: 0.2; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes chestPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.05); }
    }

    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(300px) rotate(540deg); opacity: 0; }
    }

    @media (max-width: 1080px) {
      .game-frame { padding: 14px; }
      .game-layout { grid-template-columns: 1fr; }
      .control-column { padding-top: 0; }
      .mode-buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .mode-button { width: 100%; }
      .map-wrap { width: min(100%, 760px); }
    }

    @media (max-width: 660px) {
      body { padding: 6px; }
      .game-frame { min-height: 0; border-width: 1px; border-radius: 20px; padding: 10px; }
      .mission { margin: 10px 0 8px; }
      .map-column { grid-template-columns: 24px minmax(0, 1fr); }
      .north-mark { font-size: 12px; padding-top: 8px; }
      .north-arrow { height: 34px; }
      .north-arrow::before { height: 26px; }
      .mode-buttons { grid-template-columns: 1fr; }
      .mode-button { min-height: 38px; font-size: 14px; }
      .answer-panel { padding: 12px; font-size: 14px; }
      .sentence input { width: 48px; min-width: 48px; font-size: 16px; }
      .direction-input { min-width: 0; }
      .status-row { grid-template-columns: 1fr; }
      .scale { left: 8px; bottom: 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="game-frame">
    <h1>寻宝大冒险</h1>
    <p class="mission">学校在街区里设置1个“藏宝点”，可能是公园或超市。</p>
    <div class="jumping-tip" aria-live="polite">两种方法都正确，就可以找到宝藏</div>

    <div class="game-layout">
      <section class="map-column" aria-label="寻宝地图">
        <div class="north-mark" aria-hidden="true">
          <span>北</span>
          <span class="north-arrow"></span>
        </div>
        <div class="map-stack">
          <div id="mapWrap" class="map-wrap">
            <svg id="treasureMap" class="map-svg" viewBox="0 0 700 700" role="img" aria-label="街区寻宝地图，学校、银行、公园、小明家、邮局、医院、超市分布在方格中">
              <rect width="700" height="700" fill="#ffffff"></rect>
              <g aria-hidden="true">
                <rect class="grid-frame" x="28" y="28" width="644" height="644" rx="6"></rect>
                <line class="grid-line" x1="120" y1="28" x2="120" y2="672"></line>
                <line class="grid-line" x1="212" y1="28" x2="212" y2="672"></line>
                <line class="grid-line" x1="304" y1="28" x2="304" y2="672"></line>
                <line class="grid-line" x1="396" y1="28" x2="396" y2="672"></line>
                <line class="grid-line" x1="488" y1="28" x2="488" y2="672"></line>
                <line class="grid-line" x1="580" y1="28" x2="580" y2="672"></line>
                <line class="grid-line" x1="28" y1="120" x2="672" y2="120"></line>
                <line class="grid-line" x1="28" y1="212" x2="672" y2="212"></line>
                <line class="grid-line" x1="28" y1="304" x2="672" y2="304"></line>
                <line class="grid-line" x1="28" y1="396" x2="672" y2="396"></line>
                <line class="grid-line" x1="28" y1="488" x2="672" y2="488"></line>
                <line class="grid-line" x1="28" y1="580" x2="672" y2="580"></line>
              </g>

              <g aria-hidden="true">
                <circle class="map-node" cx="120" cy="212" r="10"></circle>
                <circle class="map-node" cx="488" cy="212" r="10"></circle>
                <circle class="map-node" cx="304" cy="396" r="10"></circle>
                <circle class="map-node" cx="212" cy="488" r="10"></circle>
                <circle class="map-node" cx="488" cy="488" r="10"></circle>
                <circle class="map-node" cx="120" cy="580" r="10"></circle>
                <circle class="map-node" cx="396" cy="580" r="10"></circle>
              </g>

              <g aria-hidden="true">
                <text class="map-label map-label--small" x="580" y="176" text-anchor="middle">公园</text>
                <text class="map-label" x="190" y="268" text-anchor="middle">银行</text>
                <text class="map-label" x="338" y="356" text-anchor="middle">小明家</text>
                <text class="map-label map-label--small" x="565" y="448" text-anchor="middle">医院</text>
                <text class="map-label" x="236" y="538" text-anchor="middle">邮局</text>
                <text class="map-label" x="114" y="632" text-anchor="middle">学校</text>
                <text class="map-label" x="484" y="632" text-anchor="middle">超市</text>
              </g>

              <g class="direction-overlay" aria-hidden="true">
                <line class="overlay-cross" x1="150" y1="42" x2="150" y2="658"></line>
                <line class="overlay-cross" x1="42" y1="600" x2="658" y2="600"></line>
                <line class="overlay-axis" x1="150" y1="600" x2="452" y2="600"></line>
                <line class="overlay-main-line" x1="150" y1="600" x2="452" y2="530"></line>
                <path class="overlay-arc" d="M224 600 A74 74 0 0 0 222 583"></path>
                <circle class="overlay-anchor" cx="150" cy="600" r="6"></circle>
                <circle class="overlay-anchor" cx="452" cy="530" r="6"></circle>
                <g class="overlay-chip">
                  <rect x="275" y="538" width="108" height="34" rx="17"></rect>
                  <text class="overlay-text" x="329" y="560" text-anchor="middle">1000米</text>
                </g>
                <g class="overlay-chip">
                  <rect x="210" y="548" width="76" height="34" rx="17"></rect>
                  <text class="overlay-text" x="248" y="570" text-anchor="middle">13°</text>
                </g>
                <text class="overlay-axis-label" x="462" y="594" text-anchor="start">东</text>
                <text class="overlay-axis-label" x="162" y="58" text-anchor="start">北</text>
              </g>
            </svg>
            <svg class="treasure-pin" viewBox="0 0 180 126" role="img" aria-label="宝箱图片">
              <path d="M25 57h130v58H25z" fill="#c97418" stroke="#603704" stroke-width="7"/>
              <path d="M29 57c6-33 30-49 61-49s55 16 61 49z" fill="#f5b72d" stroke="#603704" stroke-width="7"/>
              <path d="M19 57h142v25H19z" fill="#e9941b" stroke="#603704" stroke-width="7"/>
              <path d="M87 11v104" stroke="#fff1a9" stroke-width="13"/>
              <path d="M23 91h132" stroke="#8b510e" stroke-width="6"/>
              <rect x="70" y="70" width="40" height="38" rx="7" fill="#ffdd54" stroke="#603704" stroke-width="6"/>
              <circle cx="90" cy="90" r="5" fill="#603704"/>
            </svg>
          </div>
          <div class="scale">比例尺1：20000</div>
        </div>
      </section>

      <section class="control-column" aria-label="答题区">
        <div class="mode-buttons" role="group" aria-label="选择寻宝方式">
          <button id="coordinateMode" class="mode-button" type="button"><span class="radio-dot" aria-hidden="true"></span>数对</button>
          <button id="directionMode" class="mode-button" type="button"><span class="radio-dot" aria-hidden="true"></span>方向+距离</button>
        </div>

        <div class="answer-panel">
          <div id="emptyNote" class="empty-note">请选择一种方法开始寻宝。</div>

          <form id="coordinateForm" hidden>
            <div class="sentence">
              <span>我认为“藏宝点”在数对（</span>
              <input id="columnInput" type="number" step="any" inputmode="decimal" aria-label="列数">
              <span>，</span>
              <input id="rowInput" type="number" step="any" inputmode="decimal" aria-label="行数">
              <span>）。</span>
            </div>
            <div class="submit-row">
              <button class="submit-button" type="submit">确定</button>
              <button class="clear-button" type="button" data-clear="coordinate">重新填写</button>
            </div>
          </form>

          <form id="directionForm" hidden>
            <div class="sentence">
              <span>我认为藏宝点在（</span>
              <input id="directionAnswer" class="direction-input" type="text" aria-label="方向和距离描述" placeholder="学校的东偏北13°方向1000米">
              <span>）。</span>
            </div>
            <div class="submit-row">
              <button class="submit-button" type="submit">确定</button>
              <button class="clear-button" type="button" data-clear="direction">重新填写</button>
            </div>
          </form>

          <div id="feedback" class="feedback" aria-live="polite"></div>

          <div class="status-row">
            <div id="coordinateStatus" class="status-card">数对：等待作答</div>
            <div id="directionStatus" class="status-card">方向+距离：等待作答</div>
          </div>

          <div id="treasureResult" class="treasure-result" hidden>
            <div>你太厉害啦！宝藏就在这里，请你打开它吧！</div>
            <button id="treasureButton" class="treasure-button" type="button" aria-label="打开宝藏">
              <svg class="treasure-svg" viewBox="0 0 180 126" aria-hidden="true">
                <path d="M25 57h130v58H25z" fill="#c97418" stroke="#603704" stroke-width="7"/>
                <path d="M29 57c6-33 30-49 61-49s55 16 61 49z" fill="#f5b72d" stroke="#603704" stroke-width="7"/>
                <path d="M19 57h142v25H19z" fill="#e9941b" stroke="#603704" stroke-width="7"/>
                <path d="M87 11v104" stroke="#fff1a9" stroke-width="13"/>
                <path d="M23 91h132" stroke="#8b510e" stroke-width="6"/>
                <rect x="70" y="70" width="40" height="38" rx="7" fill="#ffdd54" stroke="#603704" stroke-width="6"/>
                <circle cx="90" cy="90" r="5" fill="#603704"/>
              </svg>
            </button>
            <div id="blessing" class="blessing" hidden></div>
            <div id="confettiField" class="confetti-field" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var coordinateAnswer = { column: 4, row: 1 };
      var blessings = [
        "六年时光沉淀专属宝藏，愿你带着收获奔赴下一程山海",
        "少年心怀璀璨宝藏，前路漫漫亦会步步生光",
        "积攒学识与勇气做行囊，你本身就是独一无二的宝藏",
        "毕业解锁成长新篇章，愿你的人生宝藏愈发丰盈闪亮",
        "珍藏童年美好宝藏，带着热爱奔赴更远的远方",
        "心怀热忱皆是宝藏，往后岁岁年年皆得所愿",
        "岁月赠予成长宝藏，勇敢奔赴属于你的广阔天地",
        "自带光芒便是无价宝藏，提笔书写崭新少年篇章",
        "收好六年珍贵回忆宝藏，昂首阔步奔赴崭新旅程",
        "以初心守护心中宝藏，未来一路繁花万丈荣光"
      ];
      var state = {
        activeMode: "",
        coordinateWrongCount: 0,
        directionWrongCount: 0,
        coordinateCorrect: false,
        directionCorrect: false,
        audioContext: null
      };
      var elements = {};

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }

      function init() {
        elements.mapWrap = document.getElementById("mapWrap");
        elements.coordinateMode = document.getElementById("coordinateMode");
        elements.directionMode = document.getElementById("directionMode");
        elements.emptyNote = document.getElementById("emptyNote");
        elements.coordinateForm = document.getElementById("coordinateForm");
        elements.directionForm = document.getElementById("directionForm");
        elements.columnInput = document.getElementById("columnInput");
        elements.rowInput = document.getElementById("rowInput");
        elements.directionAnswer = document.getElementById("directionAnswer");
        elements.feedback = document.getElementById("feedback");
        elements.coordinateStatus = document.getElementById("coordinateStatus");
        elements.directionStatus = document.getElementById("directionStatus");
        elements.treasureResult = document.getElementById("treasureResult");
        elements.treasureButton = document.getElementById("treasureButton");
        elements.blessing = document.getElementById("blessing");
        elements.confettiField = document.getElementById("confettiField");

        elements.coordinateMode.addEventListener("click", function () { selectMode("coordinate"); });
        elements.directionMode.addEventListener("click", function () { selectMode("direction"); });
        elements.coordinateForm.addEventListener("submit", submitCoordinate);
        elements.directionForm.addEventListener("submit", submitDirection);
        elements.treasureButton.addEventListener("click", openTreasure);
        document.querySelectorAll("[data-clear]").forEach(function (button) {
          button.addEventListener("click", function () { clearForm(button.getAttribute("data-clear")); });
        });
        registerServiceWorker();
      }

      function selectMode(mode) {
        state.activeMode = mode;
        startAudio();
        elements.mapWrap.classList.toggle("is-direction-active", mode === "direction");
        elements.emptyNote.hidden = true;
        elements.coordinateForm.hidden = mode !== "coordinate";
        elements.directionForm.hidden = mode !== "direction";
        elements.coordinateMode.classList.toggle("is-active", mode === "coordinate");
        elements.directionMode.classList.toggle("is-active", mode === "direction");
        showFeedback("请填写你的" + (mode === "coordinate" ? "数对" : "方向和距离") + "答案。", false, false);
        if (mode === "coordinate") {
          elements.columnInput.focus();
        } else {
          elements.directionAnswer.focus();
        }
      }

      function submitCoordinate(event) {
        var column;
        var row;
        event.preventDefault();
        startAudio();
        column = Number(elements.columnInput.value);
        row = Number(elements.rowInput.value);

        if (!Number.isFinite(column) || !Number.isFinite(row)) {
          showFeedback("请把数对里的两个数字都填完整。", false, true);
          return;
        }

        if (column === coordinateAnswer.column && row === coordinateAnswer.row) {
          markCorrect("coordinate");
          return;
        }

        state.coordinateWrongCount += 1;
        if (state.coordinateWrongCount % 3 === 0) {
          showFeedback("没关系，寻宝就是需要不断尝试呀", false, true);
          return;
        }

        if (column < row) {
          showFeedback("数对的第一个数表示“列”，第二个数表示“行”哦，再调整一下吧！", false, true);
          return;
        }

        if (Math.abs(column - coordinateAnswer.column) < 2 && Math.abs(row - coordinateAnswer.row) < 2) {
          showFeedback("离宝藏超近了，再调整一下吧！", false, true);
          return;
        }

        showFeedback("宝藏不在这个位置哦", false, true);
      }

      function submitDirection(event) {
        var result;
        var message;
        event.preventDefault();
        startAudio();
        result = checkDirectionAnswer(elements.directionAnswer.value);

        if (result.correct) {
          markCorrect("direction");
          return;
        }

        state.directionWrongCount += 1;
        message = getDirectionHint(result);
        showFeedback(message, false, true);
        speak(message);
      }

      function checkDirectionAnswer(value) {
        var text = normalizeText(value);
        var hasSchool = text.indexOf("学校") !== -1;
        var hasDirection = text.indexOf("东偏北") !== -1;
        var hasDegree = /(12|13|14)(°|度)?/.test(text);
        var hasDistance = /(980|1000|1020)米?/.test(text);
        return {
          correct: hasSchool && hasDirection && hasDegree && hasDistance,
          hasSchool: hasSchool,
          hasDirection: hasDirection,
          hasDegree: hasDegree,
          hasDistance: hasDistance,
          empty: text.length === 0
        };
      }

      function getDirectionHint(result) {
        var missingCount = [result.hasSchool, result.hasDirection, result.hasDegree, result.hasDistance].filter(function (value) { return !value; }).length;
        if (result.empty || missingCount >= 2) {
          return "想一想，少了什么关键信息呢？";
        }
        if (!result.hasSchool) {
          return "想一想，观测点写清楚了吗？";
        }
        if (!result.hasDirection) {
          return "再想一想，藏宝点的方向正确吗？";
        }
        if (!result.hasDegree) {
          return "再想一想，藏宝点的方向对应的角度正确吗？";
        }
        if (!result.hasDistance) {
          return "再想一想，藏宝点的距离正确吗？";
        }
        return "宝藏不在这里哦！";
      }

      function markCorrect(mode) {
        if (mode === "coordinate") {
          state.coordinateCorrect = true;
          elements.coordinateStatus.textContent = "数对：已经答对";
          elements.coordinateStatus.classList.add("is-done");
          elements.coordinateMode.classList.add("is-done");
        } else {
          state.directionCorrect = true;
          elements.directionStatus.textContent = "方向+距离：已经答对";
          elements.directionStatus.classList.add("is-done");
          elements.directionMode.classList.add("is-done");
        }

        if (state.coordinateCorrect && state.directionCorrect) {
          showTreasure();
          return;
        }

        showFeedback("恭喜你，已经答对一种方法了，继续尝试第二种方法吧！", true, true);
      }

      function showTreasure() {
        elements.mapWrap.classList.add("is-found");
        elements.treasureResult.hidden = false;
        showFeedback("宝藏就在这里！", true, true);
        playMelody([523, 659, 784, 1046], 0.12);
      }

      function openTreasure() {
        var index = Math.floor(Math.random() * blessings.length);
        startAudio();
        elements.blessing.textContent = blessings[index];
        elements.blessing.hidden = false;
        createConfetti();
        playMelody([784, 988, 1175, 1319, 1568], 0.1);
      }

      function clearForm(mode) {
        if (mode === "coordinate") {
          elements.columnInput.value = "";
          elements.rowInput.value = "";
          elements.columnInput.focus();
        } else {
          elements.directionAnswer.value = "";
          elements.directionAnswer.focus();
        }
        showFeedback("可以重新修改输入，再试一次。", false, false);
      }

      function showFeedback(message, success, sound) {
        elements.feedback.textContent = message;
        elements.feedback.classList.toggle("is-success", success);
        elements.feedback.style.animation = "none";
        elements.feedback.offsetHeight;
        elements.feedback.style.animation = "pop 180ms ease";
        if (sound) {
          playMelody(success ? [523, 659, 784] : [392, 330], 0.1);
        }
      }

      function createConfetti() {
        var colors = ["#e60012", "#f5b832", "#2e83c6", "#0a8c51", "#d55469"];
        var i;
        elements.confettiField.innerHTML = "";
        for (i = 0; i < 52; i += 1) {
          var piece = document.createElement("span");
          piece.className = "confetti-piece";
          piece.style.left = Math.random() * 100 + "%";
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = Math.random() * 0.45 + "s";
          piece.style.transform = "rotate(" + Math.random() * 180 + "deg)";
          elements.confettiField.appendChild(piece);
        }
      }

      function normalizeText(value) {
        return String(value || "")
          .replace(/\s+/g, "")
          .replace(/。/g, "")
          .replace(/，/g, "")
          .replace(/,/g, "")
          .replace(/东偏北方向/g, "东偏北")
          .trim();
      }

      function startAudio() {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          return;
        }
        if (!state.audioContext) {
          state.audioContext = new AudioContext();
        }
        if (state.audioContext.state === "suspended") {
          state.audioContext.resume();
        }
      }

      function playMelody(notes, duration) {
        var ctx;
        var now;
        startAudio();
        ctx = state.audioContext;
        if (!ctx) {
          return;
        }
        now = ctx.currentTime;
        notes.forEach(function (frequency, index) {
          var oscillator = ctx.createOscillator();
          var gain = ctx.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, now + index * duration);
          gain.gain.exponentialRampToValueAtTime(0.12, now + index * duration + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (index + 1) * duration);
          oscillator.connect(gain).connect(ctx.destination);
          oscillator.start(now + index * duration);
          oscillator.stop(now + (index + 1) * duration + 0.02);
        });
      }

      function speak(message) {
        if (!("speechSynthesis" in window)) {
          return;
        }
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "zh-CN";
        utterance.rate = 0.92;
        utterance.pitch = 1.08;
        window.speechSynthesis.speak(utterance);
      }

      function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        }
      }
    }());
  </script>
</body>
</html>
