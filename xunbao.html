<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>寻宝大冒险</title>
  <style>
    :root {
      --ink: #183247;
      --frame: #28628a;
      --blue: #3c86c8;
      --blue-active: #2369a7;
      --blue-line: #7db5e8;
      --red: #d94a45;
      --pink: #b64f78;
      --panel-line: #b8d8e8;
      --success: #178457;
      --warning: #b85b14;
      --paper: #fffdf6;
      --mint: #dff5eb;
      --gold: #f6c64a;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 12px;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(224, 245, 235, 0.95), rgba(255, 247, 211, 0.88)),
        #eef7f8;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
    }

    button,
    input,
    textarea { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    textarea {
      resize: none;
    }

    .game-frame {
      position: relative;
      width: min(100%, 1240px);
      min-height: 720px;
      padding: 18px 20px 22px;
      border: 4px solid rgba(40, 98, 138, 0.85);
      border-radius: 26px;
      background: rgba(255, 253, 246, 0.98);
      box-shadow: 0 22px 48px rgba(33, 82, 113, 0.18);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      color: #1d5f8f;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: clamp(38px, 5.6vw, 68px);
      font-weight: 900;
      line-height: 1.08;
      text-align: center;
      letter-spacing: 0;
    }

    .mission {
      width: fit-content;
      max-width: 100%;
      margin: 10px auto 8px;
      padding: 8px 18px;
      border: 2px solid rgba(59, 133, 193, 0.16);
      border-radius: 999px;
      background: #ffffff;
      color: #244c67;
      font-size: clamp(17px, 2.1vw, 25px);
      font-weight: 900;
      line-height: 1.35;
      text-align: center;
      box-shadow: 0 10px 22px rgba(40, 98, 138, 0.1);
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 22px;
      align-items: start;
      margin-top: 14px;
    }

    .map-column {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .north-mark {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding-top: 110px;
      color: #111111;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .north-arrow {
      position: relative;
      width: 18px;
      height: 88px;
    }

    .north-arrow::before {
      position: absolute;
      left: 50%;
      top: 12px;
      width: 3px;
      height: 68px;
      background: #111111;
      content: "";
      transform: translateX(-50%);
    }

    .north-arrow::after {
      position: absolute;
      left: 50%;
      top: 0;
      width: 0;
      height: 0;
      border-right: 8px solid transparent;
      border-bottom: 14px solid #111111;
      border-left: 8px solid transparent;
      content: "";
      transform: translateX(-50%);
    }

    .map-stack {
      position: relative;
      display: grid;
      gap: 0;
      padding: 12px 0 42px;
    }

    .jumping-tip {
      position: absolute;
      top: 6px;
      right: 14px;
      z-index: 10;
      display: block;
      max-width: min(300px, 52%);
      padding: 8px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.84);
      color: #2374a5;
      font-size: clamp(15px, 1.8vw, 22px);
      font-weight: 900;
      line-height: 1.35;
      text-align: left;
      text-shadow: none;
      box-shadow: 0 10px 20px rgba(37, 87, 121, 0.12);
      animation: floatTip 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    .map-wrap {
      position: relative;
      width: min(100%, 700px);
      overflow: hidden;
      border: 3px solid rgba(48, 121, 174, 0.28);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 18px 34px rgba(31, 93, 133, 0.12);
    }

    .map-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .grid-frame {
      fill: #fbfffd;
      stroke: #2589c8;
      stroke-width: 4;
    }

    .grid-line {
      stroke: rgba(31, 135, 208, 0.82);
      stroke-width: 3.2;
    }

    .map-node {
      fill: #e94b43;
    }

    .map-label {
      fill: rgba(28, 60, 83, 0.86);
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 1px;
      paint-order: stroke fill;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 8px;
    }

    .map-label--small {
      font-size: 46px;
    }

    .direction-overlay {
      opacity: 0;
      transform: translateY(8px);
      transform-origin: center center;
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .map-wrap.is-direction-active.has-direction-choice .direction-overlay {
      opacity: 1;
      transform: none;
    }

    .overlay-cross {
      stroke: rgba(31, 117, 185, 0.28);
      stroke-width: 2.4;
      stroke-dasharray: 10 12;
    }

    .overlay-axis {
      stroke: #ffb020;
      stroke-width: 5;
      stroke-dasharray: 10 10;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255, 176, 32, 0.24));
    }

    .overlay-main-line {
      stroke: #ff6e24;
      stroke-width: 7;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(255, 110, 36, 0.24));
    }

    .overlay-arc {
      fill: none;
      stroke: #ff9223;
      stroke-width: 5.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255, 146, 35, 0.22));
    }

    .overlay-anchor {
      fill: #ff6e24;
    }

    .overlay-chip rect {
      fill: rgba(255, 255, 255, 0.94);
      stroke: rgba(255, 110, 36, 0.2);
      stroke-width: 1.5;
    }

    .overlay-chip.is-hidden,
    .overlay-arc.is-hidden {
      display: none;
    }

    .overlay-text,
    .overlay-axis-label {
      fill: #1d4367;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-weight: 800;
      paint-order: stroke fill;
      stroke: rgba(255, 255, 255, 0.96);
      stroke-width: 6px;
    }

    .overlay-text { font-size: 21px; }

    .overlay-axis-label { font-size: 19px; }

    .treasure-pin {
      position: absolute;
      left: var(--treasure-x, 65.71%);
      top: var(--treasure-y, 59.64%);
      width: clamp(70px, 8.6vw, 104px);
      transform: translate(-50%, -58%) scale(0.84);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      filter: drop-shadow(0 10px 12px rgba(64, 42, 0, 0.25));
    }

    .is-found .treasure-pin {
      opacity: 1;
      transform: translate(-50%, -58%) scale(1);
    }

    .scale {
      position: absolute;
      left: 60%;
      bottom: 4px;
      z-index: 8;
      transform: translateX(-50%);
      color: #244c67;
      font-family: "KaiTi", "STKaiti", "SimSun", serif;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .control-column {
      display: grid;
      gap: 12px;
      align-content: start;
      padding-top: 10px;
    }

    .mode-buttons {
      display: grid;
      gap: 12px;
      justify-items: stretch;
    }

    .mode-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      min-height: 56px;
      padding: 0 16px;
      border: 3px solid var(--blue-line);
      border-radius: 18px;
      background: #edf7ff;
      color: #1d5f8f;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(79, 132, 194, 0.14), inset 0 0 0 3px rgba(255, 255, 255, 0.54);
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .mode-button:hover { transform: translateY(-2px); }

    .mode-button.is-active {
      background: var(--blue-active);
      color: #ffffff;
      box-shadow: 0 8px 0 rgba(57, 98, 152, 0.18), inset 0 0 0 4px rgba(255, 255, 255, 0.2);
    }

    .mode-button.is-done {
      border-color: #59b482;
      box-shadow: 0 0 0 4px rgba(89, 180, 130, 0.16);
    }

    .radio-dot {
      width: 30px;
      height: 30px;
      margin-right: 14px;
      border: 6px solid #356aa1;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 0 0 8px #ffffff;
    }

    .mode-button.is-active .radio-dot,
    .mode-button.is-done .radio-dot {
      background: #2f6bac;
      box-shadow: inset 0 0 0 6px #ffffff;
    }

    .answer-panel {
      padding: 16px;
      border: 2px solid rgba(94, 157, 194, 0.26);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--pink);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      box-shadow: 0 12px 24px rgba(71, 111, 145, 0.08);
    }

    form { margin: 0; }

    .sentence {
      display: grid;
      gap: 8px;
      justify-items: start;
      max-width: 100%;
      white-space: normal;
    }

    .coordinate-pair {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .prompt-prefix {
      color: #94466a;
      font-size: 19px;
      font-weight: 800;
    }

    .sentence input {
      width: 64px;
      min-width: 64px;
      min-height: 42px;
      border: 0;
      border-bottom: 3px solid rgba(72, 140, 186, 0.5);
      outline: 0;
      background: transparent;
      color: #174c78;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
    }

    .direction-choice-title {
      margin-bottom: 10px;
      color: #94466a;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.3;
    }

    .direction-fields {
      display: grid;
      gap: 10px;
    }

    .direction-field {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      min-height: 52px;
      padding: 8px 12px;
      border: 2px solid rgba(94, 157, 194, 0.28);
      border-radius: 14px;
      background: #f7fbff;
      color: #174c78;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.25;
    }

    .direction-field input {
      width: 100%;
      min-width: 0;
      min-height: 36px;
      border: 0;
      border-bottom: 3px solid rgba(72, 140, 186, 0.5);
      outline: 0;
      background: transparent;
      color: #174c78;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
    }

    .direction-field--text input {
      text-align: left;
    }

    .direction-field input:focus {
      border-bottom-color: #b91527;
      background: rgba(255, 255, 255, 0.78);
    }

    .field-label,
    .field-unit {
      white-space: nowrap;
    }

    .direction-formula {
      color: #bf3350;
      font-size: 22px;
      font-weight: 900;
    }

    .direction-field.is-correct {
      border-color: #59b482;
      background: #edfff6;
    }

    .big-paren {
      color: #bf3350;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
    }

    .sentence input:focus {
      border-bottom-color: #b91527;
      background: rgba(255, 255, 255, 0.78);
    }

    .submit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .submit-button,
    .clear-button,
    .open-button {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
    }

    .submit-button {
      background: #2477b5;
      color: #ffffff;
    }

    .clear-button,
    .open-button {
      border: 2px solid #aac6d8;
      background: #ffffff;
      color: #36566b;
    }

    .open-button {
      border-color: #f0c35a;
      background: #fff4c6;
      color: #9a5a00;
    }

    .feedback {
      min-height: 48px;
      margin-top: 12px;
      color: var(--warning);
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 900;
      line-height: 1.42;
      white-space: pre-line;
      animation: pop 180ms ease;
    }

    .feedback.is-success { color: var(--success); }

    .status-row {
      display: grid;
      gap: 12px;
    }

    .status-card {
      min-height: 92px;
      padding: 18px 20px;
      border-radius: 18px;
      background: #ffffff;
      color: #52677a;
      font-size: clamp(18px, 2.2vw, 26px);
      font-weight: 900;
      line-height: 1.35;
      box-shadow: inset 0 0 0 1px rgba(116, 150, 179, 0.16);
    }

    .status-card.is-done {
      color: var(--success);
      background: #edfff6;
      box-shadow: inset 0 0 0 2px rgba(89, 180, 130, 0.14);
    }

    .treasure-result {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 10px;
      color: var(--success);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.3;
      overflow: hidden;
    }

    .treasure-button {
      width: 146px;
      max-width: 100%;
      padding: 0;
      background: transparent;
      filter: drop-shadow(0 8px 10px rgba(64, 42, 0, 0.22));
    }

    .treasure-svg {
      display: block;
      width: 100%;
      height: auto;
      animation: chestPulse 1.4s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .blessing {
      max-width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fff7c9 0%, #ffffff 100%);
      color: #9a3b16;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 800;
      line-height: 1.32;
      text-align: center;
      box-shadow: 0 12px 22px rgba(205, 106, 0, 0.14);
    }

    .confetti-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: -16px;
      width: 9px;
      height: 16px;
      border-radius: 2px;
      animation: confetti 1.7s ease-out forwards;
    }

    @keyframes floatTip {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pop {
      from { transform: scale(0.96); opacity: 0.2; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes chestPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.05); }
    }

    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(300px) rotate(540deg); opacity: 0; }
    }

    @media (max-width: 760px) {
      .game-frame { min-height: 0; padding: 10px; border-width: 4px; }
      .mission { font-size: 18px; }
      .game-layout { grid-template-columns: minmax(0, 1fr) minmax(190px, 30vw); gap: 12px; }
      .map-column { grid-template-columns: 28px minmax(0, 1fr); gap: 6px; }
      .north-mark { font-size: 16px; padding-top: 76px; }
      .north-arrow { height: 56px; }
      .north-arrow::before { height: 42px; top: 10px; }
      .jumping-tip {
        top: 2px;
        right: 0;
        max-width: min(180px, 52%);
        font-size: 14px;
      }
      .scale {
        left: 56%;
        bottom: 0;
        font-size: 14px;
      }
      .control-column { padding-top: 0; gap: 10px; }
      .mode-buttons { justify-items: stretch; gap: 12px; }
      .mode-button {
        width: 100%;
        min-width: 0;
        min-height: 46px;
        padding: 0 10px;
        border-width: 3px;
        font-size: 22px;
      }
      .radio-dot {
        width: 18px;
        height: 18px;
        margin-right: 8px;
        border-width: 4px;
        box-shadow: inset 0 0 0 4px #ffffff;
      }
      .answer-panel { padding: 12px; font-size: 16px; }
      .prompt-prefix { font-size: 16px; }
      .sentence input {
        width: 50px;
        min-width: 50px;
        min-height: 34px;
        font-size: 18px;
      }
      .big-paren { font-size: 36px; }
      .direction-choice-title { font-size: 15px; }
      .direction-fields { gap: 8px; }
      .direction-field {
        grid-template-columns: auto auto minmax(0, 1fr) auto;
        gap: 8px;
        min-height: 46px;
        padding: 8px 10px;
        border-radius: 12px;
        font-size: 14px;
      }
      .direction-field input {
        min-height: 30px;
        font-size: 16px;
      }
      .direction-formula {
        font-size: 18px;
      }
      .submit-button,
      .clear-button,
      .open-button {
        min-height: 34px;
        padding: 0 12px;
        font-size: 13px;
      }
      .feedback {
        min-height: 30px;
        font-size: 14px;
      }
      .status-card {
        min-height: 0;
        padding: 12px;
        border-radius: 16px;
        font-size: 14px;
      }
      .treasure-result { font-size: 14px; }
    }

    @media (max-width: 430px) {
      body { padding: 6px; }
      .game-layout { grid-template-columns: 1fr; gap: 14px; }
      .control-column { padding-top: 0; }
      .mode-buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .jumping-tip {
        position: static;
        max-width: none;
        margin: 0 0 8px 28px;
      }
      .scale {
        position: static;
        transform: none;
        margin: 6px 0 0 76px;
      }
      .big-paren { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-frame">
    <h1>寻宝大冒险</h1>
    <p class="mission">六年级“位置与方向”挑战：以学校为起点，找出藏宝点的位置。</p>

    <div class="game-layout">
      <section class="map-column" aria-label="寻宝地图">
        <div class="north-mark" aria-hidden="true">
          <span>北</span>
          <span class="north-arrow"></span>
        </div>
        <div class="map-stack">
          <div class="jumping-tip" aria-live="polite">数对和方向+距离<br>都能描述同一个位置</div>
          <div id="mapWrap" class="map-wrap">
            <svg id="treasureMap" class="map-svg" viewBox="0 0 700 560" role="img" aria-label="街区寻宝地图，学校、、公园、医院分布在方格中">
              <rect width="700" height="560" fill="#ffffff"></rect>
              <g aria-hidden="true">
                <rect class="grid-frame" x="110" y="54" width="420" height="420"></rect>
                <line class="grid-line" x1="180" y1="54" x2="180" y2="474"></line>
                <line class="grid-line" x1="250" y1="54" x2="250" y2="474"></line>
                <line class="grid-line" x1="320" y1="54" x2="320" y2="474"></line>
                <line class="grid-line" x1="390" y1="54" x2="390" y2="474"></line>
                <line class="grid-line" x1="460" y1="54" x2="460" y2="474"></line>
                <line class="grid-line" x1="110" y1="124" x2="530" y2="124"></line>
                <line class="grid-line" x1="110" y1="194" x2="530" y2="194"></line>
                <line class="grid-line" x1="110" y1="264" x2="530" y2="264"></line>
                <line class="grid-line" x1="110" y1="334" x2="530" y2="334"></line>
                <line class="grid-line" x1="110" y1="404" x2="530" y2="404"></line>
              </g>

              <g aria-hidden="true">
                <circle class="map-node" cx="180" cy="404" r="18"></circle>
                <circle class="map-node" cx="460" cy="334" r="9"></circle>
                <circle class="map-node" cx="460" cy="124" r="9"></circle>
              </g>

              <g aria-hidden="true">
                <text class="map-label map-label--small" x="504" y="175" text-anchor="start">公园</text>
                <text class="map-label map-label--small" x="500" y="388" text-anchor="start">医院</text>
                <text class="map-label" x="118" y="470" text-anchor="start">学校</text>
              </g>

              <g class="direction-overlay" aria-hidden="true">
                <line class="overlay-cross" x1="180" y1="78" x2="180" y2="438"></line>
                <line class="overlay-cross" x1="98" y1="404" x2="520" y2="404"></line>
                <line id="directionGuideLine" class="overlay-axis" x1="180" y1="404" x2="460" y2="404"></line>
                <line id="directionChoiceLine" class="overlay-main-line" x1="180" y1="404" x2="460" y2="334"></line>
                <path id="directionChoiceArc" class="overlay-arc is-hidden" d="M252 404 A72 72 0 0 0 252 404"></path>
                <circle class="overlay-anchor" cx="180" cy="404" r="6"></circle>
                <circle id="directionChoicePoint" class="overlay-anchor" cx="460" cy="334" r="6"></circle>
                <g id="directionDistanceChip" class="overlay-chip is-hidden">
                  <rect x="244" y="362" width="112" height="34" rx="17"></rect>
                  <text id="directionDistanceText" class="overlay-text" x="300" y="384" text-anchor="middle"></text>
                </g>
                <g id="directionNameChip" class="overlay-chip is-hidden">
                  <rect x="228" y="422" width="92" height="34" rx="17"></rect>
                  <text id="directionNameText" class="overlay-text" x="274" y="444" text-anchor="middle"></text>
                </g>
                <g id="directionAngleChip" class="overlay-chip is-hidden">
                  <rect x="255" y="374" width="64" height="34" rx="17"></rect>
                  <text id="directionAngleText" class="overlay-text" x="287" y="396" text-anchor="middle"></text>
                </g>
                <text class="overlay-axis-label" x="470" y="398" text-anchor="start">东</text>
                <text class="overlay-axis-label" x="192" y="92" text-anchor="start">北</text>
              </g>
            </svg>
            <svg class="treasure-pin" viewBox="0 0 180 126" role="img" aria-label="元宝图标">
              <ellipse cx="90" cy="112" rx="58" ry="9" fill="rgba(89, 55, 0, 0.22)"></ellipse>
              <path d="M22 72C29 41 50 22 73 24C78 45 84 60 90 66C96 60 102 45 107 24C130 22 151 41 158 72C148 101 123 116 90 116C57 116 32 101 22 72Z" fill="#f0aa22" stroke="#7b4300" stroke-width="7" stroke-linejoin="round"></path>
              <path d="M42 72C51 58 67 50 90 50C113 50 129 58 138 72C127 86 111 94 90 94C69 94 53 86 42 72Z" fill="#ffd95f" stroke="#9a5a00" stroke-width="5" stroke-linejoin="round"></path>
              <path d="M38 72C43 55 54 42 68 35C70 50 75 62 82 72C69 78 53 78 38 72Z" fill="#ffe88c" opacity=".86"></path>
              <path d="M142 72C137 55 126 42 112 35C110 50 105 62 98 72C111 78 127 78 142 72Z" fill="#ffe88c" opacity=".86"></path>
              <path d="M62 100C76 106 104 106 118 100" fill="none" stroke="#fff2a8" stroke-width="8" stroke-linecap="round" opacity=".9"></path>
              <circle cx="90" cy="73" r="12" fill="#fff3a8" stroke="#d58a10" stroke-width="4"></circle>
            </svg>
          </div>
          <div class="scale">比例尺1：24254</div>
        </div>
      </section>

      <section class="control-column" aria-label="答题区">
        <div class="mode-buttons" role="group" aria-label="选择寻宝方式">
          <button id="coordinateMode" class="mode-button" type="button"><span class="radio-dot" aria-hidden="true"></span>数对</button>
          <button id="directionMode" class="mode-button" type="button"><span class="radio-dot" aria-hidden="true"></span>方向+距离</button>
        </div>

        <div id="answerPanel" class="answer-panel" hidden>
          <form id="coordinateForm" hidden>
            <div class="sentence">
              <span class="prompt-prefix">我认为“藏宝点”在数对</span>
              <span class="coordinate-pair">
                <span class="big-paren">（</span>
                <input id="columnInput" type="number" step="any" inputmode="decimal" aria-label="列数">
                <span class="prompt-prefix">，</span>
                <input id="rowInput" type="number" step="any" inputmode="decimal" aria-label="行数">
                <span class="big-paren">）</span>
              </span>
            </div>
            <div class="submit-row">
              <button class="submit-button" type="submit">确定</button>
              <button class="clear-button" type="button" data-clear="coordinate">重新填写</button>
            </div>
          </form>

          <form id="directionForm" hidden>
            <div class="direction-choice-title">填写与学校的方向和距离</div>
            <div class="direction-fields">
              <label class="direction-field direction-field--text">
                <span class="field-label">与学校方向：</span>
                <span class="direction-formula">（</span>
                <input id="directionNameInput" type="text" name="xunbao-direction-name" aria-label="与学校方向" autocomplete="new-password">
                <span class="direction-formula">）</span>
              </label>
              <label class="direction-field">
                <span class="field-label">度数是</span>
                <span class="direction-formula">（</span>
                <input id="directionDegreeInput" type="number" name="xunbao-direction-degree" step="any" inputmode="decimal" aria-label="度数" autocomplete="off">
                <span class="field-unit">）度</span>
              </label>
              <label class="direction-field">
                <span class="field-label">距离</span>
                <span class="direction-formula">（</span>
                <input id="directionDistanceInput" type="number" name="xunbao-direction-distance" step="any" inputmode="decimal" aria-label="距离" autocomplete="off">
                <span class="field-unit">）米</span>
              </label>
            </div>
            <div class="submit-row">
              <button class="submit-button" type="submit">确定</button>
              <button class="clear-button" type="button" data-clear="direction">重新填写</button>
            </div>
          </form>

          <div id="feedback" class="feedback" aria-live="polite"></div>
        </div>

        <div id="statusRow" class="status-row" hidden>
          <div id="coordinateStatus" class="status-card">数对：等待作答</div>
          <div id="directionStatus" class="status-card">方向+距离：等待作答</div>
        </div>

        <div id="treasureResult" class="treasure-result" hidden>
          <div>你太厉害啦！宝藏就在这里，请你打开它吧！</div>
          <button id="treasureButton" class="treasure-button" type="button" aria-label="打开宝藏">
            <svg class="treasure-svg" viewBox="0 0 180 126" aria-hidden="true">
              <ellipse cx="90" cy="112" rx="58" ry="9" fill="rgba(89, 55, 0, 0.22)"></ellipse>
              <path d="M22 72C29 41 50 22 73 24C78 45 84 60 90 66C96 60 102 45 107 24C130 22 151 41 158 72C148 101 123 116 90 116C57 116 32 101 22 72Z" fill="#f0aa22" stroke="#7b4300" stroke-width="7" stroke-linejoin="round"></path>
              <path d="M42 72C51 58 67 50 90 50C113 50 129 58 138 72C127 86 111 94 90 94C69 94 53 86 42 72Z" fill="#ffd95f" stroke="#9a5a00" stroke-width="5" stroke-linejoin="round"></path>
              <path d="M38 72C43 55 54 42 68 35C70 50 75 62 82 72C69 78 53 78 38 72Z" fill="#ffe88c" opacity=".86"></path>
              <path d="M142 72C137 55 126 42 112 35C110 50 105 62 98 72C111 78 127 78 142 72Z" fill="#ffe88c" opacity=".86"></path>
              <path d="M62 100C76 106 104 106 118 100" fill="none" stroke="#fff2a8" stroke-width="8" stroke-linecap="round" opacity=".9"></path>
              <circle cx="90" cy="73" r="12" fill="#fff3a8" stroke="#d58a10" stroke-width="4"></circle>
            </svg>
          </button>
          <div id="blessing" class="blessing" hidden></div>
          <div id="confettiField" class="confetti-field" aria-hidden="true"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var coordinateAnswer = { column: 4, row: 1 };
      var directionAnswer = { direction: "东偏北", degree: 14, distance: 1000 };
      var directionOrigin = { x: 180, y: 404 };
      var directionTarget = { x: 460, y: 334 };
      var directionScale = Math.sqrt(Math.pow(directionTarget.x - directionOrigin.x, 2) + Math.pow(directionTarget.y - directionOrigin.y, 2)) / directionAnswer.distance;
      var blessings = [
        "六年时光沉淀专属宝藏，愿你带着收获奔赴下一程山海",
        "少年心怀璀璨宝藏，前路漫漫亦会步步生光",
        "积攒学识与勇气做行囊，你本身就是独一无二的宝藏",
        "毕业解锁成长新篇章，愿你的人生宝藏愈发丰盈闪亮",
        "珍藏童年美好宝藏，带着热爱奔赴更远的远方",
        "心怀热忱皆是宝藏，往后岁岁年年皆得所愿",
        "岁月赠予成长宝藏，勇敢奔赴属于你的广阔天地",
        "自带光芒便是无价宝藏，提笔书写崭新少年篇章",
        "收好六年珍贵回忆宝藏，昂首阔步奔赴崭新旅程",
        "以初心守护心中宝藏，未来一路繁花万丈荣光"
      ];
      var state = {
        activeMode: "",
        coordinateWrongCount: 0,
        directionWrongCount: 0,
        coordinateCorrect: false,
        directionCorrect: false,
        audioContext: null
      };
      var elements = {};

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }

      function init() {
        elements.mapWrap = document.getElementById("mapWrap");
        elements.coordinateMode = document.getElementById("coordinateMode");
        elements.directionMode = document.getElementById("directionMode");
        elements.answerPanel = document.getElementById("answerPanel");
        elements.coordinateForm = document.getElementById("coordinateForm");
        elements.directionForm = document.getElementById("directionForm");
        elements.columnInput = document.getElementById("columnInput");
        elements.rowInput = document.getElementById("rowInput");
        elements.directionNameInput = document.getElementById("directionNameInput");
        elements.directionDegreeInput = document.getElementById("directionDegreeInput");
        elements.directionDistanceInput = document.getElementById("directionDistanceInput");
        elements.directionFields = Array.prototype.slice.call(document.querySelectorAll(".direction-field"));
        elements.directionGuideLine = document.getElementById("directionGuideLine");
        elements.directionChoiceLine = document.getElementById("directionChoiceLine");
        elements.directionChoiceArc = document.getElementById("directionChoiceArc");
        elements.directionChoicePoint = document.getElementById("directionChoicePoint");
        elements.directionDistanceChip = document.getElementById("directionDistanceChip");
        elements.directionNameChip = document.getElementById("directionNameChip");
        elements.directionAngleChip = document.getElementById("directionAngleChip");
        elements.feedback = document.getElementById("feedback");
        elements.statusRow = document.getElementById("statusRow");
        elements.coordinateStatus = document.getElementById("coordinateStatus");
        elements.directionStatus = document.getElementById("directionStatus");
        elements.treasureResult = document.getElementById("treasureResult");
        elements.treasureButton = document.getElementById("treasureButton");
        elements.blessing = document.getElementById("blessing");
        elements.confettiField = document.getElementById("confettiField");

        setTreasurePosition();
        elements.coordinateMode.addEventListener("click", function () { selectMode("coordinate"); });
        elements.directionMode.addEventListener("click", function () { selectMode("direction"); });
        elements.coordinateForm.addEventListener("submit", submitCoordinate);
        elements.directionForm.addEventListener("submit", submitDirection);
        elements.treasureButton.addEventListener("click", openTreasure);
        document.querySelectorAll("[data-clear]").forEach(function (button) {
          button.addEventListener("click", function () { clearForm(button.getAttribute("data-clear")); });
        });

        resetGameState();
        window.addEventListener("pageshow", resetGameState);
        registerServiceWorker();
      }

      function resetGameState() {
        state.activeMode = "";
        state.coordinateWrongCount = 0;
        state.directionWrongCount = 0;
        state.coordinateCorrect = false;
        state.directionCorrect = false;
        elements.answerPanel.hidden = true;
        elements.coordinateForm.hidden = true;
        elements.directionForm.hidden = true;
        elements.statusRow.hidden = true;
        elements.treasureResult.hidden = true;
        elements.blessing.hidden = true;
        elements.feedback.textContent = "";
        elements.feedback.classList.remove("is-success");
        elements.columnInput.value = "";
        elements.rowInput.value = "";
        clearDirectionInputs();
        elements.mapWrap.classList.remove("is-direction-active", "has-direction-choice", "is-found");
        elements.coordinateMode.classList.remove("is-active", "is-done");
        elements.directionMode.classList.remove("is-active", "is-done");
        elements.coordinateStatus.textContent = "数对：等待作答";
        elements.directionStatus.textContent = "方向+距离：等待作答";
        elements.coordinateStatus.classList.remove("is-done");
        elements.directionStatus.classList.remove("is-done");
        elements.confettiField.innerHTML = "";
        clearDirectionAttempt();
        updateStatusRowVisibility();
      }

      function setTreasurePosition() {
        var answerPoint = buildDirectionChoice(directionAnswer.direction, directionAnswer.degree, directionAnswer.distance);
        if (!answerPoint) {
          return;
        }
        elements.mapWrap.style.setProperty("--treasure-x", (answerPoint.x2 / 700 * 100).toFixed(2) + "%");
        elements.mapWrap.style.setProperty("--treasure-y", (answerPoint.y2 / 560 * 100).toFixed(2) + "%");
      }

      function selectMode(mode) {
        state.activeMode = mode;
        startAudio();
        elements.answerPanel.hidden = false;
        elements.mapWrap.classList.toggle("is-direction-active", mode === "direction");
        elements.coordinateForm.hidden = mode !== "coordinate";
        elements.directionForm.hidden = mode !== "direction";
        elements.coordinateMode.classList.toggle("is-active", mode === "coordinate");
        elements.directionMode.classList.toggle("is-active", mode === "direction");
        if (mode === "coordinate") {
          showFeedback("请填写你的数对答案。", false, false);
          elements.columnInput.focus();
        } else {
          clearDirectionInputs();
          clearDirectionAttempt();
          showFeedback("请填写与学校的方向、度数和距离。", false, false);
        }
      }

      function submitCoordinate(event) {
        var column;
        var row;
        event.preventDefault();
        startAudio();
        column = Number(elements.columnInput.value);
        row = Number(elements.rowInput.value);

        if (!Number.isFinite(column) || !Number.isFinite(row)) {
          showFeedback("请把数对里的两个数字都填完整。", false, true);
          return;
        }

        if (column === coordinateAnswer.column && row === coordinateAnswer.row) {
          markCorrect("coordinate");
          return;
        }

        state.coordinateWrongCount += 1;
        if (state.coordinateWrongCount % 3 === 0) {
          showFeedback("没关系，寻宝就是需要不断尝试呀", false, true);
          return;
        }

        if (column < row) {
          showFeedback("数对的第一个数表示“列”，第二个数表示“行”哦，再调整一下吧！", false, true);
          return;
        }

        if (Math.abs(column - coordinateAnswer.column) < 2 && Math.abs(row - coordinateAnswer.row) < 2) {
          showFeedback("离宝藏超近了，再调整一下吧！", false, true);
          return;
        }

        showFeedback("宝藏不在这个位置哦", false, true);
      }

      function submitDirection(event) {
        var result;
        event.preventDefault();
        startAudio();
        result = getDirectionResult();

        if (result.choice) {
          drawDirectionChoice(result.choice);
        } else {
          clearDirectionAttempt();
        }

        if (result.correct) {
          markCorrect("direction");
          return;
        }

        state.directionWrongCount += 1;
        showFeedback(result.message, false, true);
        speak(result.message);
      }

      function getDirectionResult() {
        var direction = normalizeDirection(elements.directionNameInput.value);
        var degree = Number(elements.directionDegreeInput.value);
        var distance = Number(elements.directionDistanceInput.value);
        var choice = buildDirectionChoice(direction, degree, distance);
        var hasDirection = direction.length > 0;
        var hasDegree = Number.isFinite(degree);
        var hasDistance = Number.isFinite(distance);
        var directionCorrect = direction === directionAnswer.direction;
        var degreeCorrect = hasDegree && degree === directionAnswer.degree;
        var distanceCorrect = hasDistance && distance === directionAnswer.distance;

        elements.directionFields.forEach(function (field) {
          field.classList.remove("is-correct");
        });

        if (!hasDirection || !hasDegree || !hasDistance) {
          return { correct: false, choice: choice, message: "请把方向、度数和距离都填完整。" };
        }
        if (directionCorrect && degreeCorrect && distanceCorrect) {
          elements.directionFields.forEach(function (field) { field.classList.add("is-correct"); });
          return { correct: true, choice: choice, message: "宝藏就在这里！" };
        }
        if (!directionCorrect) {
          return { correct: false, choice: choice, message: "再想一想，藏宝点在学校的哪个方向？" };
        }
        if (!degreeCorrect) {
          return { correct: false, choice: choice, message: "方向对了，角度再调整一下，应该是14度。" };
        }
        if (!distanceCorrect) {
          return { correct: false, choice: choice, message: "方向和角度对了，距离要填1000米。" };
        }
        return { correct: false, choice: choice, message: "宝藏不在这里哦。" };
      }

      function buildDirectionChoice(direction, degree, distance) {
        var pixelLength;
        var radian;
        var x2;
        var y2;
        if (!direction || !Number.isFinite(degree) || !Number.isFinite(distance) || distance <= 0) {
          return null;
        }
        pixelLength = distance * directionScale;
        if (direction === "东偏北") {
          radian = degree * Math.PI / 180;
          x2 = directionOrigin.x + pixelLength * Math.cos(radian);
          y2 = directionOrigin.y - pixelLength * Math.sin(radian);
          return makeDirectionChoice(x2, y2, directionOrigin.x + pixelLength * Math.cos(radian), directionOrigin.y, distance + "米", "东偏北" + degree + "°", degree + "°", degree);
        }
        if (direction === "正东" || direction === "东") {
          x2 = directionOrigin.x + pixelLength;
          y2 = directionOrigin.y;
          return makeDirectionChoice(x2, y2, x2, y2, distance + "米", "正东", "", 0);
        }
        if (direction === "正北" || direction === "北") {
          x2 = directionOrigin.x;
          y2 = directionOrigin.y - pixelLength;
          return makeDirectionChoice(x2, y2, x2, y2, distance + "米", "正北", "", 0);
        }
        return null;
      }

      function makeDirectionChoice(x2, y2, guideX2, guideY2, distanceText, directionText, angleText, degree) {
        var midX = (directionOrigin.x + x2) / 2;
        var midY = (directionOrigin.y + y2) / 2;
        var directionChipWidth = directionText.length > 3 ? 142 : 92;
        return {
          x2: Math.round(x2),
          y2: Math.round(y2),
          guideX2: Math.round(guideX2),
          guideY2: Math.round(guideY2),
          distance: distanceText,
          direction: directionText,
          angle: angleText,
          anglePath: degree ? makeAnglePath(degree) : "",
          distanceChip: { x: Math.round(midX - 62), y: Math.round(midY - 44), width: 124, textX: Math.round(midX), textY: Math.round(midY - 22) },
          directionChip: { x: Math.round(midX - directionChipWidth / 2), y: Math.round(midY + 8), width: directionChipWidth, textX: Math.round(midX), textY: Math.round(midY + 30) },
          angleChip: { x: 256, y: 374, width: 64, textX: 288, textY: 396 }
        };
      }

      function makeAnglePath(degree) {
        var endX = 252 * Math.cos(degree * Math.PI / 180) + 180 * (1 - Math.cos(degree * Math.PI / 180));
        var endY = 404 - 72 * Math.sin(degree * Math.PI / 180);
        return "M252 404 A72 72 0 0 0 " + Math.round(endX) + " " + Math.round(endY);
      }

      function clearDirectionAttempt() {
        elements.mapWrap.classList.remove("has-direction-choice");
        elements.directionDistanceChip.classList.add("is-hidden");
        elements.directionNameChip.classList.add("is-hidden");
        elements.directionAngleChip.classList.add("is-hidden");
        elements.directionChoiceArc.classList.add("is-hidden");
        elements.directionDistanceChip.querySelector("text").textContent = "";
        elements.directionNameChip.querySelector("text").textContent = "";
        elements.directionAngleChip.querySelector("text").textContent = "";
        elements.directionFields.forEach(function (field) {
          field.classList.remove("is-correct");
        });
      }

      function clearDirectionInputs() {
        elements.directionNameInput.value = "";
        elements.directionDegreeInput.value = "";
        elements.directionDistanceInput.value = "";
        elements.directionNameInput.disabled = false;
        elements.directionDegreeInput.disabled = false;
        elements.directionDistanceInput.disabled = false;
      }

      function drawDirectionChoice(choice) {
        elements.mapWrap.classList.add("has-direction-choice");
        setLine(elements.directionGuideLine, 180, 404, choice.guideX2, choice.guideY2);
        setLine(elements.directionChoiceLine, 180, 404, choice.x2, choice.y2);
        elements.directionChoicePoint.setAttribute("cx", choice.x2);
        elements.directionChoicePoint.setAttribute("cy", choice.y2);
        setOverlayChip(elements.directionDistanceChip, choice.distance, choice.distanceChip);
        setOverlayChip(elements.directionNameChip, choice.direction, choice.directionChip);

        if (choice.angle && choice.angleChip) {
          elements.directionChoiceArc.setAttribute("d", choice.anglePath);
          elements.directionChoiceArc.classList.remove("is-hidden");
          setOverlayChip(elements.directionAngleChip, choice.angle, choice.angleChip);
        } else {
          elements.directionChoiceArc.classList.add("is-hidden");
          elements.directionAngleChip.classList.add("is-hidden");
        }
      }

      function setLine(line, x1, y1, x2, y2) {
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
      }

      function setOverlayChip(chip, text, position) {
        var rect = chip.querySelector("rect");
        var label = chip.querySelector("text");
        chip.classList.remove("is-hidden");
        rect.setAttribute("x", position.x);
        rect.setAttribute("y", position.y);
        rect.setAttribute("width", position.width);
        label.setAttribute("x", position.textX);
        label.setAttribute("y", position.textY);
        label.textContent = text;
      }

      function markCorrect(mode) {
        if (mode === "coordinate") {
          state.coordinateCorrect = true;
          elements.coordinateStatus.textContent = "数对：已经答对";
          elements.coordinateStatus.classList.add("is-done");
          elements.coordinateMode.classList.add("is-done");
        } else {
          state.directionCorrect = true;
          elements.directionStatus.textContent = "方向+距离：已经答对";
          elements.directionStatus.classList.add("is-done");
          elements.directionMode.classList.add("is-done");
          lockDirectionInputs();
        }

        updateStatusRowVisibility();

        if (state.coordinateCorrect && state.directionCorrect) {
          showTreasure();
          return;
        }

        showFeedback("恭喜你，已经答对一种方法了，继续尝试第二种方法吧！", true, true);
      }

      function lockDirectionInputs() {
        elements.directionNameInput.disabled = true;
        elements.directionDegreeInput.disabled = true;
        elements.directionDistanceInput.disabled = true;
      }

      function showTreasure() {
        elements.mapWrap.classList.add("is-found");
        elements.treasureResult.hidden = false;
        elements.statusRow.hidden = false;
        showFeedback("宝藏就在这里！", true, true);
        playMelody([523, 659, 784, 1046], 0.12);
      }

      function openTreasure() {
        var index = Math.floor(Math.random() * blessings.length);
        startAudio();
        elements.blessing.textContent = blessings[index];
        elements.blessing.hidden = false;
        createConfetti();
        playMelody([784, 988, 1175, 1319, 1568], 0.1);
      }

      function clearForm(mode) {
        if (mode === "coordinate") {
          elements.columnInput.value = "";
          elements.rowInput.value = "";
          elements.columnInput.focus();
        } else {
          clearDirectionInputs();
          clearDirectionAttempt();
          elements.directionNameInput.disabled = false;
          elements.directionDegreeInput.disabled = false;
          elements.directionDistanceInput.disabled = false;
          elements.directionNameInput.focus();
        }
        showFeedback("可以重新修改输入，再试一次。", false, false);
      }

      function showFeedback(message, success, sound) {
        elements.feedback.textContent = message;
        elements.feedback.classList.toggle("is-success", success);
        elements.feedback.style.animation = "none";
        elements.feedback.offsetHeight;
        elements.feedback.style.animation = "pop 180ms ease";
        if (sound) {
          playMelody(success ? [523, 659, 784] : [392, 330], 0.1);
        }
      }

      function updateStatusRowVisibility() {
        elements.statusRow.hidden = !(state.coordinateCorrect || state.directionCorrect);
      }

      function createConfetti() {
        var colors = ["#e60012", "#f5b832", "#2e83c6", "#0a8c51", "#d55469"];
        var i;
        elements.confettiField.innerHTML = "";
        for (i = 0; i < 52; i += 1) {
          var piece = document.createElement("span");
          piece.className = "confetti-piece";
          piece.style.left = Math.random() * 100 + "%";
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = Math.random() * 0.45 + "s";
          piece.style.transform = "rotate(" + Math.random() * 180 + "deg)";
          elements.confettiField.appendChild(piece);
        }
      }

      function normalizeDirection(value) {
        return String(value || "")
          .replace(/\s+/g, "")
          .replace(/[，,。]/g, "")
          .replace(/[0-9０-９.度°]+/g, "")
          .replace(/与学校/g, "")
          .replace(/学校/g, "")
          .replace(/方向/g, "")
          .replace(/的/g, "")
          .replace(/东北/g, "东偏北")
          .trim();
      }

      function normalizeText(value) {
        return String(value || "")
          .replace(/\s+/g, "")
          .replace(/。/g, "")
          .replace(/，/g, "")
          .replace(/,/g, "")
          .replace(/东偏北方向/g, "东偏北")
          .trim();
      }

      function startAudio() {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          return;
        }
        if (!state.audioContext) {
          state.audioContext = new AudioContext();
        }
        if (state.audioContext.state === "suspended") {
          state.audioContext.resume();
        }
      }

      function playMelody(notes, duration) {
        var ctx;
        var now;
        startAudio();
        ctx = state.audioContext;
        if (!ctx) {
          return;
        }
        now = ctx.currentTime;
        notes.forEach(function (frequency, index) {
          var oscillator = ctx.createOscillator();
          var gain = ctx.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, now + index * duration);
          gain.gain.exponentialRampToValueAtTime(0.12, now + index * duration + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (index + 1) * duration);
          oscillator.connect(gain).connect(ctx.destination);
          oscillator.start(now + index * duration);
          oscillator.stop(now + (index + 1) * duration + 0.02);
        });
      }

      function speak(message) {
        if (!("speechSynthesis" in window)) {
          return;
        }
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "zh-CN";
        utterance.rate = 0.92;
        utterance.pitch = 1.08;
        window.speechSynthesis.speak(utterance);
      }

      function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        }
      }
    }());
  </script>
