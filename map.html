<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#16415f">
    <title>图形的位置-设计路线图</title>
    <link rel="stylesheet" href="vendor/leaflet.css">
    <link rel="stylesheet" href="vendor/maplibre-gl.css">
    <style>
    :root {
      --ink: #102536;
      --muted: #5c7180;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(16, 37, 54, 0.14);
      --blue: #1769aa;
      --blue-deep: #0e4979;
      --green: #2f9464;
      --orange: #f08a24;
      --red: #d8444b;
      --gold: #f5b832;
      --shadow: 0 18px 40px rgba(9, 36, 55, 0.18);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(212, 235, 235, 0.92), rgba(255, 246, 222, 0.84)),
        linear-gradient(180deg, #d9eff3 0%, #f8f4e9 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      overflow: hidden;
    }

    button,
    a { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      padding: 0;
    }

    .topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 900;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: 0 10px 28px rgba(9, 36, 55, 0.14);
      backdrop-filter: blur(10px);
    }

    .return-link,
    .tool-button,
    .view-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .return-link,
    .eyebrow,
    .side-panel {
      display: none !important;
    }

    .return-link,
    .view-button {
      border: 1px solid var(--line);
      background: #ffffff;
    }

    .return-link:hover,
    .tool-button:hover,
    .view-button:hover { transform: translateY(-1px); }

    .title-block {
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--blue-deep);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(14px, 2.2vw, 18px);
      line-height: 1.1;
      color: #16354b;
      font-weight: 900;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .tool-button {
      background: linear-gradient(180deg, #2a86c7 0%, #1769aa 100%);
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(23, 105, 170, 0.18);
    }

    .tool-button.compass { background: linear-gradient(180deg, #30a36e 0%, #237c57 100%); }
    .tool-button.clear { background: linear-gradient(180deg, #f09a38 0%, #d56f18 100%); }
    .tool-button.is-active { outline: 2px solid rgba(255, 210, 86, 0.68); }

    .view-switch {
      display: inline-flex;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.78);
    }

    .view-button {
      min-height: 26px;
      padding: 0 10px;
      font-size: 11px;
      color: var(--muted);
      background: transparent;
      border: 0;
    }

    .view-button.is-active {
      color: #ffffff;
      background: var(--ink);
      box-shadow: 0 8px 16px rgba(16, 37, 54, 0.2);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      min-height: 100vh;
    }

    .map-shell,
    .side-panel {
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .map-shell {
      position: relative;
      min-height: 100vh;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    #realMap,
    #mlMap {
      width: 100%;
      height: 100%;
      min-height: 100vh;
    }

    #realMap {
      background:
        linear-gradient(90deg, rgba(23, 105, 170, 0.12) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 105, 170, 0.12) 1px, transparent 1px),
        #edf4ec;
      background-size: 72px 72px;
    }

    .leaflet-control-attribution { display: none; }
    .leaflet-container { font: inherit; }
    .leaflet-top.leaflet-left .leaflet-control-zoom {
      margin-top: 94px;
      margin-left: 14px;
    }

    .app.is-3d #realMap .leaflet-tile-pane {
      filter: saturate(1.08) contrast(1.02);
    }

    .app.is-3d #realMap .leaflet-overlay-pane path.building-footprint {
      filter: drop-shadow(7px 9px 0 rgba(86, 105, 105, 0.28));
    }

    .app.is-2d #realMap .leaflet-overlay-pane path.building-footprint {
      filter: none;
      fill-opacity: 0.18;
    }

    .map-failed::before {
      position: absolute;
      inset: 70px 22px auto;
      z-index: 500;
      padding: 13px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      color: #9b3b12;
      font-size: 15px;
      font-weight: 900;
      content: "在线底图暂时不可用，测量标记和路线工具仍可继续使用。";
      box-shadow: 0 12px 24px rgba(20, 45, 62, 0.16);
      pointer-events: none;
    }

    .scale-readout,
    .hint,
    .view-ribbon {
      position: absolute;
      z-index: 700;
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(12, 43, 64, 0.12);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .view-ribbon {
      top: 62px;
      left: 18px;
      background: rgba(16, 37, 54, 0.72);
      color: #ffffff;
    }

    .scale-readout {
      left: 50%;
      bottom: calc(22px + 6vh);
      color: var(--blue-deep);
      font-weight: 900;
      white-space: nowrap;
      transform: translateX(-50%) scale(3);
      transform-origin: bottom center;
    }

    .hint {
      top: 62px;
      right: 18px;
      bottom: auto;
      max-width: min(360px, calc(100% - 36px));
      padding: 8px 10px;
      border-radius: 14px;
      color: #7b3d0a;
      white-space: normal;
    }

    .side-panel {
      display: grid;
      align-content: start;
      gap: 16px;
      padding: 18px;
    }

    .info-card {
      display: grid;
      gap: 10px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.78);
    }

    .info-card h2 {
      margin: 0;
      color: var(--blue-deep);
      font-size: 20px;
      font-weight: 900;
    }

    .info-line {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
      font-weight: 800;
    }

    .measure-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .measure-list li {
      padding: 12px 13px;
      border: 1px solid rgba(23, 105, 170, 0.14);
      border-radius: 14px;
      background: rgba(240, 248, 252, 0.88);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 800;
    }

    .empty-route {
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.7;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(246, 248, 250, 0.94);
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .legend i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
    }

    .legend .school i { clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 35%); background: var(--gold); }
    .legend .end i { background: var(--red); }
    .legend .building i { border-radius: 3px; background: var(--green); }

    .landmark-icon { background: transparent; border: 0; }

    .landmark-pin {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: max-content;
      padding: 3px 7px 3px 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 6px 14px rgba(14, 50, 76, 0.1);
      color: rgba(16, 37, 54, 0.88);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }

    .landmark-pin .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      color: #ffffff;
      font-size: 0;
      line-height: 1;
      background: var(--blue);
      opacity: 0.92;
    }

    .landmark-pin.school .badge {
      color: #7a4a00;
      background: var(--gold);
      clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 35%);
    }

    .landmark-pin.destination .badge { background: var(--red); }
    .landmark-pin.building .badge { background: var(--green); border-radius: 7px; }
    .landmark-pin.road .badge { background: #46596b; }

    .landmark-pin.is-leaflet {
      transform: translate(-50%, calc(-100% - 4px));
    }

    .landmark-pin.is-amap {
      transform: none;
    }

    .landmark-pin-wrap {
      position: relative;
      display: inline-block;
      transform: translate(-50%, calc(-100% - 4px));
    }

    .app.is-3d .landmark-pin.is-leaflet {
      transform: translate(-50%, calc(-100% - 6px));
      box-shadow: 6px 10px 0 rgba(53, 70, 77, 0.12), 0 10px 20px rgba(14, 50, 76, 0.16);
    }

    .app.is-3d .landmark-pin.is-amap {
      transform: none;
      box-shadow: 6px 10px 0 rgba(53, 70, 77, 0.12), 0 10px 20px rgba(14, 50, 76, 0.16);
    }

    .app.is-3d .landmark-pin-wrap {
      transform: translate(-50%, calc(-100% - 6px));
    }

    .measure-marker-icon { background: transparent; border: 0; }

    .measure-marker {
      position: relative;
      width: 18px;
      height: 18px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 4px rgba(240, 138, 36, 0.26), 0 8px 14px rgba(35, 48, 58, 0.2);
    }

    .measure-marker.end { background: var(--red); box-shadow: 0 0 0 4px rgba(216, 68, 75, 0.24), 0 8px 14px rgba(35, 48, 58, 0.2); }

    .measure-marker::after {
      position: absolute;
      left: 50%;
      bottom: 20px;
      min-width: 38px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      color: var(--ink);
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      content: attr(data-label);
      transform: translateX(-50%);
      white-space: nowrap;
      box-shadow: 0 8px 16px rgba(23, 55, 79, 0.12);
    }

    .leaflet-tooltip.distance-tooltip,
    .distance-tooltip.is-amap-overlay,
    .leaflet-tooltip.angle-tooltip {
      padding: 5px 8px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 10px 18px rgba(26, 52, 72, 0.12);
    }

    .leaflet-tooltip.distance-tooltip,
    .distance-tooltip.is-amap-overlay {
      font-weight: 900;
    }

    .leaflet-tooltip.angle-tooltip {
      color: #b45900;
      font-size: 15px;
    }

    .leaflet-tooltip.distance-tooltip::before,
    .leaflet-tooltip.angle-tooltip::before { display: none; }

    .is-amap-overlay {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
      white-space: nowrap;
    }

    .measure-marker-wrap.is-amap-overlay {
      transform: none;
    }

    .road-label-icon { background: transparent; border: 0; }

    .road-label {
      display: inline-flex;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.52);
      color: rgba(52, 80, 100, 0.8);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 5px 10px rgba(16, 37, 54, 0.08);
      backdrop-filter: blur(4px);
      transform: translate(-50%, -50%);
    }

    @media (max-width: 1120px) {
      .topbar { right: 10px; left: 10px; }
      .actions { justify-content: flex-start; }
    }

    @media (max-width: 680px) {
      .topbar { gap: 8px; padding: 8px 10px; border-radius: 14px; }
      .actions { gap: 8px; }
      .tool-button,
      .return-link { min-height: 30px; padding: 0 10px; font-size: 11px; }
      .hint { left: 12px; right: 12px; top: auto; bottom: 118px; max-width: none; }
      .scale-readout { left: 50%; bottom: calc(14px + 6vh); }
      .view-ribbon { top: 58px; left: 12px; }
    }
  </style>
  </head>
  <body>
    <main id="app" class="app is-3d">
      <header class="topbar">
        <a class="return-link" href="./index.html" hidden>返回首页</a>
        <div class="title-block">
          <p class="eyebrow">文一街小学到黄龙体育中心</p>
          <h1>图形的位置-设计路线图</h1>
        </div>
        <div class="actions" aria-label="地图工具">
          <button id="measureButton" class="tool-button"
            type="button">测量</button>
          <button id="compassButton" class="tool-button compass"
            type="button">十字方向标</button>
          <button id="clearButton" class="tool-button clear"
            type="button">清除</button>
          <div class="view-switch" role="group" aria-label="切换地图版本">
            <button id="view3d" class="view-button is-active"
              type="button">3D</button>
            <button id="view2d" class="view-button" type="button">2D</button>
          </div>
        </div>
      </header>

      <section class="workspace">

        <div id="mapShell" class="map-shell">
          <div id="realMap" aria-label="杭州市文一街小学到黄龙体育中心周边地图"></div>
          <div id="mlMap"
            style="width:100%;height:100%;position:absolute;top:0;left:0;z-index:10;display:none;"></div>
          <div id="viewRibbon" class="view-ribbon">3D版本</div>
          <div id="scaleReadout" class="scale-readout">比例尺 正在计算</div>
          <div id="hint" class="hint">点击“测量”，再在地图上依次选择起点和终点。</div>
        </div>

        <aside class="side-panel" aria-label="路线信息" hidden>
          <section class="info-card">
            <h2>地图范围</h2>
            <p class="info-line">北到文一路，东到莫干山路，西到学院路，南侧覆盖黄龙体育中心。</p>
            <div class="legend" aria-label="图例">
              <span class="school"><i></i>起点五角星</span>
              <span class="end"><i></i>终点圆点</span>
              <span class="building"><i></i>周边建筑</span>
            </div>
          </section>

          <section class="info-card">
            <h2>当前路线</h2>
            <p id="routeSummary" class="info-line">还没有完成测量。</p>
          </section>

          <section class="info-card">
            <h2>测量记录</h2>
            <div id="emptyRoute"
              class="empty-route">完成一次起点和终点选择后，这里会显示实际距离。</div>
            <ol id="measureList" class="measure-list"></ol>
          </section>
        </aside>
      </section>
    </main>

    <script src="vendor/leaflet.js"></script>
    <script src="vendor/maplibre-gl.js"></script>

  { key: "school", name: "杭州市文一街小学", shortName: "文一街小学", type: "school", lat: 30.2875, lng: 120.1425 },

      function getDistanceBetween(start, end) {

        var lat1 = toRad(start.lat);
        var lat2 = toRad(end.lat);

        var deltaLng = toRad(end.lng - start.lng);
        var a = Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(deltaLng / 2) * Math.sin(deltaLng / 2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return radius * c;

        if (currentMeasure.state === "drawing" && currentMeasure.start && currentMeasure.end) {
          currentMeasure.startMarker = makeMeasureMarker(currentMeasure.start, "起点", false);
          currentMeasure.endMarker = makeMeasureMarker(currentMeasure.end, "终点", true);
          currentMeasure.line = createPolylineOverlay([currentMeasure.start, currentMeasure.end], {
            color: "#f08a24",
            weight: 5,
            dashArray: "10 10",
            lineCap: "butt",
            pane: "routePane",
            zIndex: 330
          });
          if (!isAmapVisible()) {
            currentMeasure.line.addTo(map);
          }
          renderCurrentMeasure();
        }
      }

      function updateThreeDStatus() {
        var pitch;
        var zoom;
        if (!mlMap || !isAmapVisible()) {
          return;
        }
        pitch = mlMap.getPitch ? Math.round(mlMap.getPitch()) : 68;
        zoom = mlMap.getZoom ? mlMap.getZoom().toFixed(1) : "17.0";
        viewRibbon.textContent = currentViewMode === "3d" ? "3D版本 俯仰 " + pitch + "°  缩放 " + zoom : "2D版本  缩放 " + zoom;
        refreshAmapLandmarks();
        updateScaleDisplay();
        if (activeTool === "measure") {
          hint.textContent = currentMeasure.state === "drawing" ? "起点已确定，请单击终点确认。" : "请点击起点；也可以直接点文一街小学。";
          return;
        }
        if (activeTool === "compass") {
          hint.textContent = routeSegments.length ? "请点击已测线段的起点，显示十字方向标和较小夹角。" : "先完成一条测量线段，再使用十字方向标。";
          return;
        }
        hint.textContent = currentViewMode === "3d" ? "已切换到高德在线3D，可旋转倾斜浏览街区。" : "已切换到高德在线2D，可直接测量和显示方向标。";
      }

      function fallbackTo2D(message) {
        disableMapLibre3D();
        addBuildingFootprints();
        rebuildVisibleOverlays();
        app.classList.remove("is-3d");
        app.classList.add("is-2d");
        view3d.classList.remove("is-active");
        view2d.classList.add("is-active");
        viewRibbon.textContent = "2D版本";
        scaleReadout.textContent = "比例尺 正在计算";
        if (map) {
          setTimeout(function () {
            map.invalidateSize();
            updateScaleDisplay();
          }, 40);
        }
        hint.textContent = message;
      }

      function getAmapLoadErrorMessage(error) {
        if (!error || !error.message) {
          return "高德3D在线地图加载失败，请检查浏览器代理、securityJsCode 和域名白名单。";
        }
        if (error.message === "amap-script-blocked" || error.message === "amap-load-timeout") {
          return "高德 JS API 没有真正执行。当前浏览器可能把脚本重定向到了认证页/代理页，或当前域名/IP 的安全校验未通过。";
        }
        if (error.message === "amap-load-failed") {
          return "高德3D在线地图脚本加载失败，请检查网络、代理认证或浏览器拦截。";
        }
        return "高德3D在线地图加载失败，请检查浏览器代理、securityJsCode 和域名白名单。";
      }

      function addTiles() {
        var primaryLoaded = false;
        var fallbackAdded = false;
        var fallbackTimer = setTimeout(function () {
          if (!primaryLoaded) {
            activateFallback();
          }
        }, 2500);
        var gaode = L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
          subdomains: ["1", "2", "3", "4"],
          minZoom: 3,
          maxZoom: 19
        });

        gaode.on("load", function () {
          primaryLoaded = true;
          clearTimeout(fallbackTimer);
          mapShell.classList.remove("map-failed");
        });
        gaode.on("tileerror", function () {
          if (!primaryLoaded) {
            activateFallback();
          }
        });
        gaode.addTo(map);

        function activateFallback() {
          if (fallbackAdded) {
            return;
          }
          fallbackAdded = true;
          clearTimeout(fallbackTimer);
          if (map.hasLayer(gaode)) {
            map.removeLayer(gaode);
          }
          L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            minZoom: 3,
            maxZoom: 19
          }).on("tileerror", function () {
            mapShell.classList.add("map-failed");
          }).on("load", function () {
            mapShell.classList.remove("map-failed");
          }).addTo(map);
        }
      }

      function addRoads() {
        roads.forEach(function (road) {
          L.polyline(road.points, {
            color: "#f7c948",
            weight: road.name === "天目山路" ? 9 : 7,
            opacity: 0.82,
            lineCap: "round",
            interactive: false
          }).addTo(map);
          L.polyline(road.points, {
            color: "#ffffff",
            weight: road.name === "天目山路" ? 3 : 2,
            opacity: 0.9,
            lineCap: "round",
            interactive: false
          }).addTo(map);
          L.marker(road.label, {
            interactive: false,
            pane: "labelPane",
            icon: L.divIcon({
              className: "road-label-icon",
              html: '<span class="road-label">' + road.name + '</span>',
              iconSize: null,
              iconAnchor: [0, 0]
            })
          }).addTo(map);
        });
      }

      function addBuildingFootprints() {
        buildingModels.forEach(function (building) {
          addRect(building.bounds, building.color);
        });

        function addRect(bounds, color) {
          L.rectangle(bounds, {
            className: "building-footprint",
            color: color,
            weight: 2,
            opacity: 0.8,
            fillColor: color,
            fillOpacity: 0.34,
            interactive: false
          }).addTo(map);
        }
      }

      function createThreeDStyle() {
        return {
          version: 8,
          sources: {
            area: {
              type: 'geojson',
              data: buildAreaGeoJSON()
            },
            roads: {
              type: 'geojson',
              data: buildRoadGeoJSON()
            },
            buildings: {
              type: 'geojson',
              data: buildBuildingGeoJSON()
            },
            landmarks: {
              type: 'geojson',
              data: buildLandmarkGeoJSON()
            }
          },
          layers: [
            {
              id: 'background',
              type: 'background',
              paint: {
                'background-color': '#cfe0ea'
              }
            },
            {
              id: 'area-fill',
              type: 'fill',
              source: 'area',
              paint: {
                'fill-color': '#edf4ec',
                'fill-opacity': 0.96
              }
            },
            {
              id: 'road-casing',
              type: 'line',
              source: 'roads',
              layout: {
                'line-cap': 'round',
                'line-join': 'round'
              },
              paint: {
                'line-color': '#c67419',
                'line-width': ['interpolate', ['linear'], ['zoom'], 13, ['+', ['get', 'width'], 1.5], 16, ['+', ['get', 'width'], 4.5]],
                'line-opacity': 0.42
              }
            },
            {
              id: 'road-fill',
              type: 'line',
              source: 'roads',
              layout: {
                'line-cap': 'round',
                'line-join': 'round'
              },
              paint: {
                'line-color': '#f4d77c',
                'line-width': ['interpolate', ['linear'], ['zoom'], 13, ['get', 'width'], 16, ['+', ['get', 'width'], 2]],
                'line-opacity': 0.96
              }
            },
            {
              id: 'landmark-halo',
              type: 'circle',
              source: 'landmarks',
              paint: {
                'circle-color': '#ffffff',
                'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 5, 16, 9],
                'circle-opacity': 0.96
              }
            },
            {
              id: 'landmark-core',
              type: 'circle',
              source: 'landmarks',
              paint: {
                'circle-color': ['get', 'color'],
                'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 3, 16, 6],
                'circle-stroke-color': '#ffffff',
                'circle-stroke-width': 1.5,
                'circle-opacity': 0.96
              }
            },
            {
              id: 'building-footprint-fill',
              type: 'fill',
              source: 'buildings',
              paint: {
                'fill-color': ['get', 'color'],
                'fill-opacity': 0.16
              }
            },
            {
              id: 'building-extrusion',
              type: 'fill-extrusion',
              source: 'buildings',
              paint: {
                'fill-extrusion-color': ['get', 'color'],
                'fill-extrusion-height': ['get', 'height'],
                'fill-extrusion-base': 0,
                'fill-extrusion-opacity': 0.95,
                'fill-extrusion-vertical-gradient': true
              }
            }
          ]
        };
      }

      function buildAreaGeoJSON() {
        return {
          type: 'FeatureCollection',
          features: [{
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'Polygon',
              coordinates: [boundsToRing(areaBounds)]
            }
          }]
        };
      }

      function buildRoadGeoJSON() {
        return {
          type: 'FeatureCollection',
          features: roads.map(function (road) {
            return {
              type: 'Feature',
              properties: {
                name: road.name,
                width: road.name === '天目山路' ? 8 : road.name === '黄龙路' ? 6 : 5
              },
              geometry: {
                type: 'LineString',
                coordinates: road.points.map(toLngLat)
              }
            };
          })
        };
      }

      function buildBuildingGeoJSON() {
        return {
          type: 'FeatureCollection',
          features: buildingModels.map(function (building) {
            return {
              type: 'Feature',
              properties: {
                key: building.key,
                name: building.name,
                color: building.color,
                height: building.height
              },
              geometry: {
                type: 'Polygon',
                coordinates: [boundsToRing(building.bounds)]
              }
            };
          })
        };
      }

      function buildLandmarkGeoJSON() {
        return {
          type: 'FeatureCollection',
          features: landmarks.map(function (place) {
            return {
              type: 'Feature',
              properties: {
                key: place.key,
                name: place.name,
                color: place.type === 'school' ? '#f5b832' : place.type === 'destination' ? '#d8444b' : '#2f9464'
              },
              geometry: {
                type: 'Point',
                coordinates: [place.lng, place.lat]
              }
            };
          })
        };
      }

      function boundsToRing(bounds) {
        var southWest = bounds[0];
        var northEast = bounds[1];
        var south = southWest[0];
        var west = southWest[1];
        var north = northEast[0];
        var east = northEast[1];
        return [
          [west, south],
          [east, south],
          [east, north],
          [west, north],
          [west, south]
        ];
      }

      function toLngLat(point) {
        return [point[1], point[0]];
      }

      function addLandmarks() {
        landmarks.forEach(function (place) {
          var marker = L.marker([place.lat, place.lng], {
            title: place.name,
            icon: makeLandmarkIcon(place)
          }).addTo(map);
          marker.on("click", function (event) {
            handleMapChoice(event.latlng, place.shortName, "leaflet-landmark:" + place.key);
            L.DomEvent.stop(event);
          });
        });
      }

      function makeLandmarkIcon(place) {
        var badge = place.type === "school" ? "" : place.type === "destination" ? "" : "";
        var className = "landmark-pin " + place.type;
        var inner = '<span class="badge">' + badge + '</span><span>' + place.shortName + '</span>';
        return L.divIcon({
          className: "landmark-icon",
          html: '<span class="' + className + ' is-leaflet">' + inner + '</span>',
          iconSize: null,
          iconAnchor: [0, 0]
        });
      }

      function activateMeasure() {
        activeTool = "measure";
        clearGuide();
        clearCurrentMeasure();
        currentMeasure.state = "await-start";
        measureButton.classList.add("is-active");
        compassButton.classList.remove("is-active");
        hint.textContent = isAmapVisible() ? "请在当前高德地图上单击任意位置作为起点，再单击任意位置作为终点。" : "请在地图上单击任意位置作为起点，再单击任意位置作为终点。";
      }

      function activateCompass() {
        activeTool = "compass";
        clearCurrentMeasure();
        measureButton.classList.remove("is-active");
        compassButton.classList.add("is-active");
        hint.textContent = routeSegments.length ? "请点击已测线段的起点，显示十字方向标和较小夹角。" : "先完成一条测量线段，再使用十字方向标。";
      }

      function handleMapChoice(latlng, label, source) {
        latlng = normalizeLatLng(latlng) || latlng;
        if ((!map && !mlMap) || !latlng) {
          return;
        }
        if (isDuplicateMapChoice(latlng, source)) {
          return;
        }
        rememberMapChoice(latlng, source);

        if (activeTool === "compass") {
          showCompass(latlng);
          return;
        }

        if (activeTool !== "measure") {
          return;
        }

        if (currentMeasure.state === "await-start") {
          currentMeasure.start = latlng;
          currentMeasure.startLabel = label;
          currentMeasure.end = null;
          currentMeasure.previewEnd = null;
          currentMeasure.state = "drawing";
          currentMeasure.startMarker = makeMeasureMarker(latlng, "起点", false);
          currentMeasure.endMarker = null;
          currentMeasure.line = createPolylineOverlay([latlng, latlng], {
            color: "#f08a24",
            weight: 5,
            dashArray: "10 10",
            lineCap: "butt",
            pane: "routePane",
            zIndex: 330
          });
          if (!isAmapVisible()) {
            currentMeasure.line.addTo(map);
          }
          hint.textContent = "起点已确定，请单击任意位置确认终点；也可以点黄龙体育中心。";
          return;
        }

        if (currentMeasure.state === "drawing") {
          currentMeasure.end = latlng;
          currentMeasure.previewEnd = null;
          currentMeasure.endLabel = label;
          completeMeasurement();
        }
      }

      function handleMouseMove(event) {
        if (event && event.latlng) {
          event.latlng = normalizeLatLng(event.latlng) || event.latlng;
        }
        if (activeTool !== "measure" || currentMeasure.state !== "drawing") {
          return;
        }
        currentMeasure.previewEnd = event.latlng;
        renderCurrentMeasure();
      }

      function renderCurrentMeasure() {
        var targetPoint;
        if (!currentMeasure.line || !currentMeasure.start) {
          return;
        }
        targetPoint = currentMeasure.end || currentMeasure.previewEnd;
        if (!targetPoint) {
          setPolylinePath(currentMeasure.line, [currentMeasure.start, currentMeasure.start]);
          return;
        }
        if (!currentMeasure.end) {
          setPolylinePath(currentMeasure.line, [currentMeasure.start, targetPoint]);
          return;
        }
        if (!currentMeasure.endMarker) {
          currentMeasure.endMarker = makeMeasureMarker(currentMeasure.end, "终点", true);
        }
        setPolylinePath(currentMeasure.line, [currentMeasure.start, targetPoint]);
        setOverlayPosition(currentMeasure.endMarker, currentMeasure.end);
      }

      function completeMeasurement() {
        var distance = getDistanceBetween(currentMeasure.start, currentMeasure.end);
        var middle;
        var tooltip;
        var segment;

        if (distance < 8) {
          hint.textContent = "起点和终点太近了，请重新选择终点。";
          return;
        }

        renderCurrentMeasure();
        setLineStyle(currentMeasure.line, { color: "#d8444b", weight: 6, dashArray: null, opacity: 1, lineCap: "butt" });
        middle = {
          lat: (currentMeasure.start.lat + currentMeasure.end.lat) / 2,
          lng: (currentMeasure.start.lng + currentMeasure.end.lng) / 2
        };
        tooltip = isAmapVisible() ? createAmapTextOverlay(middle, "distance-tooltip", "实际距离 " + formatDistance(distance), 350) : L.tooltip({
          permanent: true,
          direction: "center",
          className: "distance-tooltip",
          opacity: 1,
          interactive: false,
          pane: "routePane"
        }).setLatLng(middle).setContent("实际距离 " + formatDistance(distance)).addTo(map);

        segment = {
          start: currentMeasure.start,
          end: currentMeasure.end,
          startLabel: currentMeasure.startLabel || "起点",
          endLabel: currentMeasure.endLabel || "终点",
          distance: distance,
          line: currentMeasure.line,
          startMarker: currentMeasure.startMarker,
          endMarker: currentMeasure.endMarker,
          tooltip: tooltip
        };
        routeSegments.push(segment);
        if (!isAmapVisible()) {
          routeLayer.addLayer(segment.line);
          routeLayer.addLayer(segment.startMarker);
          routeLayer.addLayer(segment.endMarker);
          routeLayer.addLayer(segment.tooltip);
        }
        currentMeasure = emptyMeasure();
        currentMeasure.state = "await-start";
        renderMeasureList();
        hint.textContent = "测量完成。可继续点击新的起点和终点，或使用十字方向标。";
      }

      function makeMeasureMarker(latlng, label, isEnd) {
        if (isAmapVisible() && window.AMap && window.AMap.Marker && window.AMap.Pixel) {
          var amapMarker = new AMap.Marker({
            position: toAmapPathPoint(latlng),
            anchor: "center",
            offset: new AMap.Pixel(0, 0),
            bubble: true,
            zIndex: 360,
            content: '<span class="measure-marker-wrap is-amap-overlay"><span class="measure-marker' + (isEnd ? " end" : "") + '" data-label="' + label + '"></span></span>'
          });
          amapMarker.setMap(mlMap);
          return amapMarker;
        }
        return L.marker(latlng, {
          interactive: false,
          pane: "routePane",
          icon: L.divIcon({
            className: "measure-marker-icon",
            html: '<span class="measure-marker' + (isEnd ? " end" : "") + '" data-label="' + label + '"></span>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
          })
        }).addTo(map);
      }

      function showCompass(clickedLatLng) {
        var segment = findCompassSegment(clickedLatLng);
        var center;
        var bearing;
        var nearestAxis;
        var delta;
        var angle;
        var axisLabel;
        var arcPoints;
        var midBearing;

        clearGuide();
        if (!segment) {
          hint.textContent = "先用“测量”完成一条线段，再点击线段的起点。";
          return;
        }

        setSegmentHighlight(segment);
        center = segment.start;
        bearing = bearingBetween(segment.start, segment.end);
        nearestAxis = Math.round(bearing / 90) * 90;
        nearestAxis = normalizeBearing(nearestAxis);
        delta = shortestBearingDelta(nearestAxis, bearing);
        angle = Math.abs(delta);
        axisLabel = getAxisLabel(nearestAxis);
        guideLayer = isAmapVisible() ? [] : L.layerGroup().addTo(map);
        addCompassLine(center, 0, 180, "rgba(23, 105, 170, 0.28)", 2);
        addCompassLine(center, 90, 270, "rgba(23, 105, 170, 0.28)", 2);
        addGuideOverlay(createPolylineOverlay([center, destinationPoint(center, nearestAxis, 900)], {
          color: "#ffb020",
          weight: 4,
          opacity: 1,
          dashArray: "7 10",
          lineCap: "round",
          interactive: false,
          pane: "guidePane",
          zIndex: 370
        }));
        arcPoints = makeArc(center, nearestAxis, delta, 210);
        addGuideOverlay(createPolylineOverlay(arcPoints, {
          color: "#ff8c1a",
          weight: 5,
          opacity: 0.95,
          lineCap: "round",
          interactive: false,
          pane: "guidePane",
          zIndex: 380
        }));
        midBearing = normalizeBearing(nearestAxis + delta / 2);
        addGuideOverlay(isAmapVisible() ? createAmapTextOverlay(destinationPoint(center, midBearing, 265), "angle-tooltip", "∠ " + Math.round(angle) + "°", 390) : L.tooltip({
          permanent: true,
          direction: "center",
          className: "angle-tooltip",
          opacity: 1,
          interactive: false,
          pane: "guidePane"
        }).setLatLng(destinationPoint(center, midBearing, 265)).setContent("∠ " + Math.round(angle) + "°").addTo(guideLayer));
        hint.textContent = "已显示十字方向标：线段与" + axisLabel + "虚线的较小夹角约为 " + Math.round(angle) + "°。";

        function addCompassLine(origin, bearingA, bearingB, color, weight) {
          addGuideOverlay(createPolylineOverlay([destinationPoint(origin, bearingA, 900), destinationPoint(origin, bearingB, 900)], {
            color: color,
            weight: weight,
            opacity: 1,
            dashArray: "8 12",
            interactive: false,
            pane: "guidePane",
            zIndex: 360
          }));
        }
      }

      function addGuideOverlay(overlay) {
        if (!overlay) {
          return null;
        }
        if (Array.isArray(guideLayer)) {
          guideLayer.push(overlay);
        } else if (guideLayer && overlay.addTo) {
          overlay.addTo(guideLayer);
        }
        return overlay;
      }

      function findCompassSegment(latlng) {
        var best = null;
        var bestDistance = Infinity;
        routeSegments.forEach(function (segment) {
          var distance = getDistanceBetween(latlng, segment.start);
          if (distance < bestDistance) {
            best = segment;
            bestDistance = distance;
          }
        });
        return bestDistance <= 350 ? best : routeSegments[routeSegments.length - 1];
      }

      function makeArc(center, startBearing, delta, radius) {
        var steps = Math.max(8, Math.ceil(Math.abs(delta) / 6));
        var points = [];
        var i;
        for (i = 0; i <= steps; i += 1) {
          points.push(destinationPoint(center, normalizeBearing(startBearing + delta * i / steps), radius));
        }
        return points;
      }

      function clearMeasurements() {
        clearCurrentMeasure();
        clearGuide();
        routeSegments.forEach(function (segment) {
          removeOverlay(segment.line);
          removeOverlay(segment.startMarker);
          removeOverlay(segment.endMarker);
          removeOverlay(segment.tooltip);
        });
        if (routeLayer && routeLayer.clearLayers) {
          routeLayer.clearLayers();
        }
        routeSegments = [];
        activeTool = "";
        measureButton.classList.remove("is-active");
        compassButton.classList.remove("is-active");
        renderMeasureList();
        hint.textContent = "已清除路线。点击“测量”重新开始。";
      }

      function clearCurrentMeasure() {
        [currentMeasure.startMarker, currentMeasure.endMarker, currentMeasure.line].forEach(function (layer) {
          removeOverlay(layer);
        });
        lastMapChoice = null;
        currentMeasure = emptyMeasure();
      }

      function clearGuide() {
        clearSegmentHighlight();
        if (Array.isArray(guideLayer)) {
          guideLayer.forEach(removeOverlay);
          guideLayer = [];
        } else if (guideLayer) {
          guideLayer.clearLayers();
        }
      }

      function setSegmentHighlight(segment) {
        clearSegmentHighlight();
        if (!segment || !segment.line) {
          return;
        }
        setLineStyle(segment.line, { color: "#ff7f11", weight: 7, opacity: 1, dashArray: null });
        bringLineToFront(segment.line);
        highlightedSegment = segment;
      }

      function clearSegmentHighlight() {
        if (!highlightedSegment || !highlightedSegment.line) {
          highlightedSegment = null;
          return;
        }
        setLineStyle(highlightedSegment.line, { color: "#d8444b", weight: 6, opacity: 1, dashArray: null });
        highlightedSegment = null;
      }

      function renderMeasureList() {
        var total = routeSegments.reduce(function (sum, segment) { return sum + segment.distance; }, 0);
        emptyRoute.hidden = routeSegments.length > 0;
        measureList.innerHTML = "";
        routeSegments.forEach(function (segment, index) {
          var item = document.createElement("li");
          item.textContent = (index + 1) + ". " + segment.startLabel + " 到 " + segment.endLabel + "：" + formatDistance(segment.distance);
          measureList.appendChild(item);
        });
        routeSummary.textContent = routeSegments.length ? "已测 " + routeSegments.length + " 段，总实际距离 " + formatDistance(total) + "。" : "还没有完成测量。";
      }

      function setViewMode(mode) {
        currentViewMode = mode;
        app.classList.toggle("is-3d", mode === "3d");
        app.classList.toggle("is-2d", mode === "2d");
        view3d.classList.toggle("is-active", mode === "3d");
        view2d.classList.toggle("is-active", mode === "2d");
        viewRibbon.textContent = mode === "3d" ? "3D版本" : "2D版本";
        hint.textContent = mode === "3d" ? "已切换到3D版本，建筑物会以立体效果显示。" : "已切换到2D版本，测量和方向标仍可使用。";
        if (AMAP_WEB_KEY) {
          enableMapLibre3D(mode);
        } else if (mode === "2d") {
          disableMapLibre3D();
          disableBuildingFootprints();
          addBuildingFootprints();
        }
      }

      function disableBuildingFootprints() {
        // 移除伪3D footprint
        var overlays = document.querySelectorAll('.building-footprint');
        overlays.forEach(function (el) { el.remove(); });
      }

      function addAreaMask() {
        if (!map) {
          return;
        }
        if (areaMaskLayer && map.hasLayer(areaMaskLayer)) {
          map.removeLayer(areaMaskLayer);
        }
        areaMaskLayer = L.polygon([
          [[-90, -180], [-90, 180], [90, 180], [90, -180]],
          [[30.2652, 120.1262], [30.2652, 120.1513], [30.2962, 120.1513], [30.2962, 120.1262]]
        ], {
          pane: "maskPane",
          stroke: false,
          fillColor: "#dce8eb",
          fillOpacity: 0.94,
          interactive: false
        }).addTo(map);
      }

      function buildAmapMaskPath() {
        return [
          [120.1262, 30.2652],
          [120.1513, 30.2652],
          [120.1513, 30.2962],
          [120.1262, 30.2962]
        ];
      }

      function updateScaleDisplay() {
        var metersPerPixel;
        var denominator;
        var pointA;
        var pointB;
        var meters;
        var container;
        var rect;
        var samplePixels;
        var sampleY;
        var center;
        var zoom;
        var latitude;
        if (isAmapVisible() && mlMap && mlMap.getZoom && mlMap.getCenter) {
          container = mlMap.getContainer ? mlMap.getContainer() : document.getElementById("mlMap");
          rect = container && container.getBoundingClientRect ? container.getBoundingClientRect() : null;
          if (rect && rect.width > 0 && rect.height > 0) {
            samplePixels = Math.min(200, Math.max(100, rect.width / 4));
            sampleY = rect.height / 2;
            pointA = getAmapLatLngFromContainerPoint(rect.width / 2 - samplePixels / 2, sampleY);
            pointB = getAmapLatLngFromContainerPoint(rect.width / 2 + samplePixels / 2, sampleY);
            if (pointA && pointB) {
              meters = getDistanceBetween(pointA, pointB);
              metersPerPixel = meters / samplePixels;
            }
          }
          if (!isFinite(metersPerPixel) || metersPerPixel <= 0) {
            center = mlMap.getCenter();
            zoom = Number(mlMap.getZoom());
            latitude = center && typeof center.getLat === "function" ? center.getLat() : center && center.lat;
            if (isFinite(zoom) && isFinite(latitude)) {
              metersPerPixel = 156543.03392 * Math.cos(latitude * Math.PI / 180) / Math.pow(2, zoom);
            }
          }
        } else if (map) {
          pointA = map.containerPointToLatLng([0, map.getSize().y / 2]);
          pointB = map.containerPointToLatLng([100, map.getSize().y / 2]);
          meters = map.distance(pointA, pointB);
          metersPerPixel = meters / 100;
        }
        if (!isFinite(metersPerPixel) || metersPerPixel <= 0) {
          scaleReadout.textContent = "比例尺 正在计算";
          return;
        }
        denominator = Math.max(1000, Math.round((metersPerPixel / 0.000264583) / 100) * 100);
        scaleReadout.textContent = "比例尺 1:" + denominator.toLocaleString("zh-CN");
      }

      function emptyMeasure() {
        return {
          state: "idle",
          start: null,
          end: null,
          previewEnd: null,
          startLabel: "起点",
          endLabel: "终点",
          startMarker: null,
          endMarker: null,
          line: null
        };
      }

      function formatDistance(distance) {
        if (distance >= 1000) {
          return (distance / 1000).toFixed(2) + "千米";
        }
        return Math.round(distance) + "米";
      }

      function normalizeBearing(value) {
        return (value % 360 + 360) % 360;
      }

      function shortestBearingDelta(fromBearing, toBearing) {
        return ((toBearing - fromBearing + 540) % 360) - 180;
      }

      function getAxisLabel(bearing) {
        if (bearing === 0) { return "北向"; }
        if (bearing === 90) { return "东向"; }
        if (bearing === 180) { return "南向"; }
        return "西向";
      }

      function bearingBetween(start, end) {
        var lat1 = toRad(start.lat);
        var lat2 = toRad(end.lat);
        var deltaLng = toRad(end.lng - start.lng);
        var y = Math.sin(deltaLng) * Math.cos(lat2);
        var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLng);
        return normalizeBearing(toDeg(Math.atan2(y, x)));
      }

      function destinationPoint(origin, bearing, distance) {
        var radius = 6378137;
        var angularDistance = distance / radius;
        var bearingRad = toRad(bearing);
        var lat1 = toRad(origin.lat);
        var lng1 = toRad(origin.lng);
        var lat2 = Math.asin(Math.sin(lat1) * Math.cos(angularDistance) + Math.cos(lat1) * Math.sin(angularDistance) * Math.cos(bearingRad));
        var lng2 = lng1 + Math.atan2(Math.sin(bearingRad) * Math.sin(angularDistance) * Math.cos(lat1), Math.cos(angularDistance) - Math.sin(lat1) * Math.sin(lat2));
        return L.latLng(toDeg(lat2), toDeg(lng2));
      }

      function toRad(value) { return value * Math.PI / 180; }
      function toDeg(value) { return value * 180 / Math.PI; }

      function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(function () {});
        }
      }
    }());
  </script>
